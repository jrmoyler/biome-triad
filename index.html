<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helios Triad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed world, one glass instrument strip docked bottom, title plate top-left */
:root{--ink:#f3ead9;--mute:#a59c8b;--glass:rgba(14,12,10,.58);--line:rgba(243,234,217,.14);--sun:#e7a64a;--display:"Cormorant Garamond",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:#07090c;color:var(--ink);font-family:var(--mono);-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.plate{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:5;pointer-events:none}
.plate h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,40px);letter-spacing:.02em;margin:0;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.plate p{margin:6px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.plate b{color:var(--sun);font-weight:500}
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center;max-width:calc(100vw - 32px);padding:8px 12px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;transition:opacity .2s,transform .2s}
#hud.off{opacity:0;pointer-events:none;transform:translate(-50%,12px)}
.grp{display:flex;align-items:center;gap:2px}
.grp>span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-right:4px}
button{font:500 11px/1 var(--mono);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer}
button:hover{background:rgba(243,234,217,.08)}
button:focus-visible{outline:1px solid var(--sun);outline-offset:1px}
button[aria-pressed="true"]{background:var(--sun);color:#1a1208}
#meta{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:9ch;text-align:right}
#show{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--glass);border:1px solid var(--line)}
.help{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;font-size:10px;line-height:1.7;color:var(--mute);text-align:right;pointer-events:none}
#stick{position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:1px solid var(--line);background:rgba(14,12,10,.3);z-index:6;touch-action:none;display:none}
#knob{position:absolute;left:30px;top:30px;width:36px;height:36px;border-radius:50%;background:rgba(243,234,217,.35)}
#veil{position:fixed;inset:0;display:grid;place-items:center;z-index:8;background:#07090c;transition:opacity .5s;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);text-align:center;padding:24px}
#veil.gone{opacity:0;pointer-events:none}
#veil strong{display:block;font-family:var(--display);font-size:34px;letter-spacing:.02em;text-transform:none;color:var(--ink);font-weight:500;margin-bottom:8px}
@media (pointer:coarse){#stick{display:block}.help{display:none}}
@media (max-width:640px){.grp>span{display:none}}
@media (prefers-reduced-motion:reduce){#veil,#hud{transition:none}}
</style>

</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
addEventListener('error', e => { const m=document.getElementById('veilMsg'); if (m) { m.textContent='Could not start the renderer: '+(e.message||'unknown error'); document.getElementById('veil').classList.remove('gone'); } });
</script>
<script type="module">
/* ============================================================================
   HELIOS ENGINE
   A biome is a plug-in registered with Helios.registerBiome({...}):
     id, label                 unique key + HUD label
     sky   {turbidity, rayleigh, mie, mieG}
     fog   {density, tint:[r,g,b]}      FogExp2 density, colour multiplier
     ground [r,g,b]                     hemisphere bounce colour
     camera {pos:[x,y,z], look:[x,y,z]} or a function(kit) returning that
     clouds {cover, base, top, cirrus}  volumetric sky settings (optional)
     build(kit) -> { group, heightAt(x,z), update?(dt, env) }
   kit gives: THREE, Q (quality), noise, rng, tex, makeTerrain, makeWater,
   instTiled, flora (crowns, palms, rocks, boats), scatter + plant geometry builders, smoothstep, lerp, srgb.
   ========================================================================== */
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { Water } from 'three/addons/objects/Water.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const TAU = Math.PI * 2;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const lerp = (a,b,t) => a + (b-a)*t;
const smoothstep = (a,b,x) => { const t = clamp((x-a)/(b-a), 0, 1); return t*t*(3-2*t); };

/* ---------- Noise ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PERM = new Uint8Array(512);
{ const r = rng(7), p = [...Array(256).keys()]; for (let i=255;i>0;i--){ const j=Math.floor(r()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; } for (let i=0;i<512;i++) PERM[i]=p[i&255]; }
const fade = t => t*t*t*(t*(t*6-15)+10);
function grad(h,x,y){ switch(h&7){case 0:return x+y;case 1:return -x+y;case 2:return x-y;case 3:return -x-y;case 4:return x;case 5:return -x;case 6:return y;default:return -y;} }
function perlin(x,y,per=256){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const X0=((xi%per)+per)%per&255, Y0=((yi%per)+per)%per&255, X1=((X0+1)%per)&255, Y1=((Y0+1)%per)&255;
  const u=fade(xf), v=fade(yf);
  const aa=PERM[PERM[X0]+Y0], ba=PERM[PERM[X1]+Y0], ab=PERM[PERM[X0]+Y1], bb=PERM[PERM[X1]+Y1];
  return lerp(lerp(grad(aa,xf,yf),grad(ba,xf-1,yf),u), lerp(grad(ab,xf,yf-1),grad(bb,xf-1,yf-1),u), v)*0.7;
}
function fbm(x,y,oct=5,per=256){ let s=0,a=0.5,f=1; for(let i=0;i<oct;i++){ s+=a*perlin(x*f,y*f,per*f); f*=2; a*=0.5; } return s; }
function ridged(x,y,oct=4){ let s=0,a=0.5,f=1; for(let i=0;i<oct;i++){ const n=1-Math.abs(perlin(x*f,y*f)); s+=a*n*n; f*=2; a*=0.5; } return s; }
const hash2 = (x,y) => { const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); };
const noise = { perlin, fbm, ridged, hash2 };

/* ---------- Renderer & world ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, logarithmicDepthBuffer:true, powerPreference:'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbfcad6, 0.001);
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.5, 16000);

const sky = new Sky(); sky.scale.setScalar(12000); scene.add(sky);
const envScene = new THREE.Scene(); const envSky = new Sky(); envSky.material = sky.material; envSky.scale.setScalar(80); envScene.add(envSky);
const pmrem = new THREE.PMREMGenerator(renderer); let envRT = null;

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.castShadow = true; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.9;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x3a3020, 0.3); scene.add(hemi);

/* ---------- Quality ---------- */
const DPR = devicePixelRatio || 1;
const QUALITY = {
  fast:     { label:'Fast',     pr:Math.min(DPR,1.75), shadow:1024, ext:110, density:0.35, water:0,    seg:0.55, puffs:4, cards:60,  lod:85,  leafShadow:false, cardK:0.6,  impRes:192, cloud:18 },
  balanced: { label:'Balanced', pr:Math.min(DPR,2),    shadow:2048, ext:170, density:0.75, water:1024, seg:0.8,  puffs:6, cards:90,  lod:150, leafShadow:true,  cardK:0.85, impRes:320, cloud:28 },
  ultra:    { label:'Ultra',    pr:Math.min(DPR,2.5),  shadow:4096, ext:230, density:1.0,  water:2048, seg:1.0,  puffs:7, cards:130, lod:240, leafShadow:true,  cardK:1.0,  impRes:448, cloud:40 }
};
let qKey = matchMedia('(pointer:coarse)').matches ? 'fast' : 'balanced';
let Q = QUALITY[qKey];
let dynScale = 1;
function applyQuality(){
  sun.shadow.mapSize.set(Q.shadow, Q.shadow);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  const e = Q.ext, c = sun.shadow.camera; c.left=-e; c.right=e; c.top=e; c.bottom=-e; c.near=1; c.far=1600; c.updateProjectionMatrix();
  resize();
}
function resize(){
  renderer.setPixelRatio(Q.pr * dynScale);
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ---------- Procedural textures ---------- */
function canvasTex(w, h, fn, { srgb=true } = {}){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d'); const img = g.createImageData(w,h); const d = img.data;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ const o=(y*w+x)*4; const v=fn(x/w,y/h); d[o]=v[0]; d[o+1]=v[1]; d[o+2]=v[2]; d[o+3]=v[3]??255; }
  g.putImageData(img,0,0); return finishTex(new THREE.CanvasTexture(c), srgb);
}
function finishTex(t, srgb=true){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy=MAX_ANISO; t.userData.keep=true; return t; }

const tex = {};
tex.waterNormals = (() => {
  const S=512, H=(u,v)=>fbm(u*8,v*8,5,8), e=1/S;
  return canvasTex(S,S,(u,v)=>{ const dx=(H(u+e,v)-H(u-e,v))*14, dy=(H(u,v+e)-H(u,v-e))*14; const l=Math.hypot(dx,dy,1); return [(-dx/l*0.5+0.5)*255,(-dy/l*0.5+0.5)*255,(1/l*0.5+0.5)*255]; }, { srgb:false });
})();
tex.ground = canvasTex(256,256,(u,v)=>{ const n=0.86+0.14*fbm(u*16,v*16,5,16) + (hash2(u*256,v*256)-0.5)*0.06; const g=clamp(n,0,1)*255; return [g,g,g]; });
tex.leaf = canvasTex(256,256,(u,v)=>{ const n=fbm(u*12,v*12,4,12); const s=hash2(Math.floor(u*90),Math.floor(v*90)); const g=clamp(0.78+n*0.45-(s>0.86?0.35:0),0.25,1)*255; return [g,g,g]; });
tex.leaf.repeat.set(2,2);
tex.leafCluster = (() => {
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d'); const r=rng(61);
  for (let i=0;i<78;i++){
    const a=r()*TAU, d=Math.sqrt(r())*94, x=128+Math.cos(a)*d, y=128+Math.sin(a)*d;
    const len=16+r()*17, w=len*(0.36+r()*0.14), rot=a+(r()-0.5)*1.3, l=48+r()*44, h=86+r()*24;
    g.save(); g.translate(x,y); g.rotate(rot);
    const gr=g.createLinearGradient(-len,0,len,0); gr.addColorStop(0,`hsl(${h},16%,${l-22}%)`); gr.addColorStop(1,`hsl(${h},12%,${l}%)`);
    g.fillStyle=gr; g.beginPath(); g.ellipse(0,0,len,w,0,0,TAU); g.fill();
    g.strokeStyle='rgba(20,30,10,.35)'; g.lineWidth=1.2; g.beginPath(); g.moveTo(-len*0.9,0); g.lineTo(len*0.9,0); g.stroke();
    g.restore();
  }
  return finishTex(new THREE.CanvasTexture(c));
})();
tex.bark = canvasTex(64,256,(u,v)=>{ const n=0.78+0.22*fbm(u*4,v*28,4,4)+0.08*Math.sin(v*120+perlin(u*8,v*8)*3); const g=clamp(n,0,1)*255; return [g,g,g]; });
tex.frond = (() => {
  const c=document.createElement('canvas'); c.width=128; c.height=512; const g=c.getContext('2d'); const r=rng(3);
  g.lineCap='round';
  for (let y=496;y>12;y-=7){ const t=1-y/512; const len=10+58*Math.sin(Math.PI*Math.min(1,t*1.1)); for (const s of [-1,1]){ g.strokeStyle=`hsl(${78+r()*18},${45+r()*20}%,${30+r()*14}%)`; g.lineWidth=3.2+r()*1.5; g.beginPath(); g.moveTo(64,y); g.quadraticCurveTo(64+s*len*0.5,y-6,64+s*len,y-18-r()*8); g.stroke(); } }
  g.strokeStyle='#6d6a3a'; g.lineWidth=4; g.beginPath(); g.moveTo(64,512); g.lineTo(64,6); g.stroke();
  return finishTex(new THREE.CanvasTexture(c));
})();
tex.cloud = (() => {
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d'); const r=rng(9);
  for (let i=0;i<34;i++){ const x=60+r()*136, y=90+r()*80, rad=24+r()*46; const gr=g.createRadialGradient(x,y,0,x,y,rad); gr.addColorStop(0,'rgba(255,255,255,.55)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,256,256); }
  return finishTex(new THREE.CanvasTexture(c));
})();
tex.glow = (() => { const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.25,'rgba(255,200,120,.6)'); gr.addColorStop(1,'rgba(255,140,40,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); return finishTex(new THREE.CanvasTexture(c)); })();

/* ---------- Wind (shared vertex sway for foliage) ---------- */
const WIND = { value: new THREE.Vector2(0, 1) };
function addWind(mat, amp){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uWind = WIND;
    sh.vertexShader = 'uniform vec2 uWind;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        vec3 ip = instanceMatrix[3].xyz;
      #else
        vec3 ip = vec3(0.0);
      #endif
      float sw = sin(uWind.x*1.1 + ip.x*0.071 + ip.z*0.053) + 0.45*sin(uWind.x*2.9 + ip.z*0.13 + ip.x*0.02);
      float hh = max(position.y, 0.0);
      transformed.x += sw * ${amp.toFixed(3)} * uWind.y * hh;
      transformed.z += sw * ${(amp*0.6).toFixed(3)} * uWind.y * hh;`);
  };
  mat.customProgramCacheKey = () => 'wind' + amp;
  return mat;
}

/* ---------- Building blocks ---------- */
const srgb = (c, r, g, b) => c.setRGB(r, g, b, THREE.SRGBColorSpace);
function keep(m){ m.userData.keep = true; return m; }
function keepG(g){ g.userData.keep = true; return g; }

/* Terrain shading: world-space noise keeps vertex colour from reading as flat. Albedo breakup at three
   scales, slope-driven strata rock, wet shoreline, wind-rippled sand, crop rows, shoreline foam and
   underwater caustics. The per-pixel bump comes from screen-space derivatives of the same noise. */
const NOISE2D = `
float th21(vec2 p){ vec3 q = fract(vec3(p.xyx)*0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y)*q.z); }
float tvn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
  return mix(mix(th21(i), th21(i + vec2(1.0,0.0)), f.x), mix(th21(i + vec2(0.0,1.0)), th21(i + vec2(1.0,1.0)), f.x), f.y); }
float tfbm(vec2 p){ float s = 0.0, a = 0.5; for (int i=0;i<4;i++){ s += a*tvn(p); p = p*2.03 + 17.3; a *= 0.5; } return s; }
float tbump(vec2 p, float n3, float f0, float f1, float f2, float rpA, float cpA){
  float h = 0.6*tvn(p*2.3)*f0 + 0.3*tvn(p*9.0)*f1 + 0.1*tvn(p*37.0)*f2;
  if (rpA > 0.0){ float ph = dot(p, vec2(0.88, 0.47))*5.5 + n3*10.0 + tvn(p*0.3)*6.0; float r = 1.0 - abs(sin(ph)); h += rpA*r*r*f0; }
  if (cpA > 0.0) h += cpA*1.3*(0.5 + 0.5*sin(p.x*8.4 + n3*3.0 + p.y*0.15))*f0;
  return h;
}
`;
function terrainMaterial(d = {}){
  const o = { rock:[0.42,0.38,0.34], rockLo:0.3, bump:14, ripple:0, wet:0.5, foam:0, caustic:0, rows:0, grain:1, ...d };
  const rc = new THREE.Color().setRGB(o.rock[0], o.rock[1], o.rock[2], THREE.SRGBColorSpace);
  const U = { uRock:{ value:new THREE.Vector4(rc.r, rc.g, rc.b, o.rockLo) }, uTD:{ value:new THREE.Vector4(o.bump, o.ripple, o.wet, o.rows) },
    uTE:{ value:new THREE.Vector3(o.foam, o.caustic, o.grain) }, uT:WIND };
  const m = new THREE.MeshStandardMaterial({ vertexColors:true, map:tex.ground, roughness:0.95, metalness:0 });
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = 'attribute float kind; varying vec3 vWP; varying vec3 vWN; varying float vKind;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vWP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normalize(mat3(modelMatrix) * objectNormal); vKind = kind;`);
    sh.fragmentShader = 'uniform vec4 uRock, uTD; uniform vec3 uTE; uniform vec2 uT; varying vec3 vWP; varying vec3 vWN; varying float vKind;\n' + NOISE2D + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec2 twp = vWP.xz;
        float n3 = tfbm(twp*0.045), n1 = tvn(twp*1.1), n2 = tvn(twp*5.3 + 4.1), n4 = tvn(twp*23.0);
        float slope = 1.0 - clamp(vWN.y, 0.0, 1.0);
        float crop = step(0.5, vKind) * step(vKind, 1.5);
        diffuseColor.rgb *= (0.74 + 0.5*n3) * (0.86 + 0.28*n1) * (0.93 + 0.14*n2) * mix(1.0, 0.94 + 0.12*n4, uTE.z);
        float rk = smoothstep(uRock.w, uRock.w + 0.2, slope + (n3 - 0.5)*0.2);
        float strata = 0.8 + 0.3*sin(vWP.y*1.7 + n3*5.0) + 0.14*(n2 - 0.5);
        diffuseColor.rgb = mix(diffuseColor.rgb, uRock.rgb * strata * (0.78 + 0.44*n1), rk);
        float rowc = 0.5 + 0.5*sin(twp.x*8.4 + n3*3.0 + twp.y*0.15);
        diffuseColor.rgb *= 1.0 - crop*(0.28 - 0.36*rowc)*uTD.w*(1.0 - smoothstep(18.0, 70.0, length(vViewPosition)));
        float wet = (1.0 - smoothstep(0.0, 1.5, vWP.y)) * step(-0.4, vWP.y) * uTD.z;
        diffuseColor.rgb *= 1.0 - 0.4*wet;
        if (uTE.x > 0.0){
          float wv = 0.32*sin(uT.x*0.7 + n3*9.0) + 0.09*sin(uT.x*1.9 + twp.x*0.05);
          float band = smoothstep(0.5, 0.0, abs(vWP.y - 0.28 - wv)) * smoothstep(0.28, 0.62, n2 + 0.25*n1);
          float band2 = smoothstep(0.35, 0.0, abs(vWP.y + 0.9 + wv*1.4)) * smoothstep(0.5, 0.78, n2) * 0.6;
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.93, 0.95, 0.95), clamp(band + band2, 0.0, 1.0)*uTE.x);

const _sunDir = new THREE.Vector3(), _moonDir = new THREE.Vector3(), _c = new THREE.Color(), _c2 = new THREE.Color();
const FOG_DAY = new THREE.Color().setRGB(0.66,0.75,0.85,THREE.SRGBColorSpace), FOG_GOLD = new THREE.Color().setRGB(0.86,0.64,0.44,THREE.SRGBColorSpace), FOG_NIGHT = new THREE.Color().setRGB(0.035,0.05,0.085,THREE.SRGBColorSpace), FOG_RAIN = new THREE.Color().setRGB(0.42,0.46,0.5,THREE.SRGBColorSpace);
function updateAtmosphere(dt){
  const [az, el] = S.sun, rainK = S.wx[1], fogK = S.wx[0];
  _sunDir.set(Math.sin(az)*Math.cos(el), Math.sin(el), -Math.cos(az)*Math.cos(el)).normalize();
  const day = smoothstep(-0.06, 0.18, el), golden = 1 - smoothstep(0.08, 0.5, el), night = 1 - smoothstep(-0.12, 0.02, el);

  const u = sky.material.uniforms, sp = activeDef.sky;
  u.turbidity.value = lerp(sp.turbidity, 18, rainK); u.rayleigh.value = lerp(sp.rayleigh, 0.6, rainK);
  u.mieCoefficient.value = lerp(sp.mie, 0.02, rainK); u.mieDirectionalG.value = sp.mieG;
  u.sunPosition.value.copy(_sunDir);

  // Light: sun by day, moon by night
  _moonDir.set(-_sunDir.x, Math.max(0.35, -_sunDir.y), -_sunDir.z).normalize();
  const useSun = el > -0.03, dir = useSun ? _sunDir : _moonDir;
  if (useSun) _c.setRGB(1.0, 0.95, 0.88).lerp(_c2.setRGB(1.0, 0.55, 0.25), golden*0.85); else _c.setRGB(0.55, 0.65, 1.0);
  sun.color.copy(_c);
  sun.intensity = (useSun ? 3.0*smoothstep(-0.03, 0.12, el) : 0.35*night) * (1 - rainK*0.7);
  hemi.color.setRGB(0.7,0.8,1.0); hemi.groundColor.setRGB(...activeDef.ground);
  hemi.intensity = lerp(0.35, 1.9, day) * (1 - rainK*0.3) * (1 + S.flash*4);
  VU.uSunDir.value.copy(dir); VU.uSunCol.value.copy(sun.color).multiplyScalar(sun.intensity);
  VU.uHemiSky.value.copy(hemi.color).multiplyScalar(hemi.intensity); VU.uHemiGround.value.copy(hemi.groundColor).multiplyScalar(hemi.intensity);

  // Shadow camera follows the viewer, snapped to texels to stop shimmer
  const texel = (2*Q.ext)/Q.shadow;
  const tx = Math.round(S.pos.x/texel)*texel, tz = Math.round(S.pos.z/texel)*texel;
  sun.target.position.set(tx, S.pos.y*0.5, tz);
  sun.position.set(tx + dir.x*600, S.pos.y*0.5 + dir.y*600, tz + dir.z*600);

  // Fog
  _c.copy(FOG_DAY).lerp(FOG_GOLD, golden*day).lerp(FOG_NIGHT, night);
  const t = activeDef.fog.tint; _c.r*=t[0]; _c.g*=t[1]; _c.b*=t[2];
  _c.lerp(_c2.copy(FOG_RAIN).multiplyScalar(0.25+0.75*day), rainK*0.8);

  { const tg = activeDef.clouds || CLOUD_DEFAULT, e = ease(1.2, dt);
    for (const k in CLOUD_DEFAULT) cloudState[k] += ((tg[k] ?? CLOUD_DEFAULT[k]) - cloudState[k]) * e;

    CL.uFogK.value = 0.92*smoothstep(1.2, 4.0, fogK); CL.uTime.value = S.time; CL.uSteps.value = Q.cloud;
    CL.uWind.value.x += dt*(7 + rainK*14); CL.uWind.value.y += dt*(2.5 + rainK*5);

    CL.uAmbBot.value.copy(VU.uHemiSky.value).multiplyScalar(0.16); _c2.copy(VU.uHemiGround.value).multiplyScalar(0.6); CL.uAmbBot.value.add(_c2);

  rain.material.opacity = rainK * 0.55; rain.visible = rainK > 0.02;
  if (rain.visible){
    const p = rain.geometry.attributes.position.array, sd = rain.userData.seeds, n = sd.length/3, fall = S.time*28;
    for (let i=0;i<n;i++){ const y = 60 - ((sd[i*3+1] + fall) % 60); const x=S.pos.x+sd[i*3], z=S.pos.z+sd[i*3+2], yy=S.pos.y-20+y; p[i*6]=x; p[i*6+1]=yy; p[i*6+2]=z; p[i*6+3]=x+0.15; p[i*6+4]=yy-1.4; p[i*6+5]=z; }

  }
  S.flash = Math.max(0, S.flash - dt*5);
  WIND.value.set(S.time, 1 + rainK*2.5);

  if (envDirty && envTimer <= 0){ if (envRT) envRT.dispose(); envRT = pmrem.fromScene(envScene, 0, 0.1, 100); scene.environment = envRT.texture; envDirty = false; envTimer = 0.25; }
  return { night, day, time:S.time };
}

  const K=S.keys, sp=(K.ShiftLeft||K.ShiftRight?60:16)*dt;

  S.tPos.x += (Math.sin(S.tYaw)*f + Math.cos(S.tYaw)*r)*sp;
  S.tPos.z += (-Math.cos(S.tYaw)*f + Math.sin(S.tYaw)*r)*sp;
  if (K.KeyE||K.Space) S.tPos.y += sp*0.8;
  if (K.KeyQ||K.KeyC) S.tPos.y -= sp*0.8;
  const floor = Math.max(active.heightAt(S.tPos.x, S.tPos.z), 0) + 1.8;
  if (S.tPos.y < floor) S.tPos.y = floor;
  S.pos.lerp(S.tPos, ease(8,dt));
  S.yaw += (S.tYaw-S.yaw)*ease(12,dt); S.pitch += (S.tPitch-S.pitch)*ease(12,dt);
  const a=ease(2.2,dt), s0=S.sun[0], s1=S.sun[1]; S.sun[0]+=(S.tSun[0]-S.sun[0])*a; S.sun[1]+=(S.tSun[1]-S.sun[1])*a;
  if (Math.abs(s0-S.sun[0])+Math.abs(s1-S.sun[1]) > 0.0008) envDirty = true;
  const b=ease(1.6,dt), pw=S.wx[1]; S.wx[0]+=(S.tWx[0]-S.wx[0])*b; S.wx[1]+=(S.tWx[1]-S.wx[1])*b; if (Math.abs(pw-S.wx[1])>0.002) envDirty = true;

  camera.position.copy(S.pos);
  _fwd.set(Math.sin(S.yaw)*Math.cos(S.pitch), Math.sin(S.pitch), -Math.cos(S.yaw)*Math.cos(S.pitch));
  camera.lookAt(_fwd.add(S.pos));
  const env = updateAtmosphere(dt);
  verdantFrame(camera);
  for (const o of SCATTERS) o.update(S.pos);
  active.update?.(dt, env);
  renderer.render(scene, camera);
}
applyQuality();
loadBiome(startId);
requestAnimationFrame(frame);
