<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helios Triad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed world, one glass instrument strip docked bottom, title plate top-left */
:root{--ink:#f3ead9;--mute:#a59c8b;--glass:rgba(14,12,10,.58);--line:rgba(243,234,217,.14);--sun:#e7a64a;--display:"Cormorant Garamond",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:#07090c;color:var(--ink);font-family:var(--mono);-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.plate{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:5;pointer-events:none}
.plate h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,40px);letter-spacing:.02em;margin:0;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.plate p{margin:6px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.plate b{color:var(--sun);font-weight:500}
#status{margin-top:4px;letter-spacing:.08em;text-transform:none;color:var(--ink);opacity:.82;max-width:min(560px,70vw);line-height:1.5}
#status:empty{display:none}
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center;max-width:calc(100vw - 32px);padding:8px 12px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;transition:opacity .2s,transform .2s}
#hud.off{opacity:0;pointer-events:none;transform:translate(-50%,12px)}
.grp{display:flex;align-items:center;gap:2px}
.grp>span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-right:4px}
button{font:500 11px/1 var(--mono);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer}
button:hover{background:rgba(243,234,217,.08)}
button:focus-visible{outline:1px solid var(--sun);outline-offset:1px}
button[aria-pressed="true"]{background:var(--sun);color:#1a1208}
#meta{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:9ch;text-align:right}
#show{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--glass);border:1px solid var(--line)}
.help{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;font-size:10px;line-height:1.7;color:var(--mute);text-align:right;pointer-events:none}
#stick{position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:1px solid var(--line);background:rgba(14,12,10,.3);z-index:6;touch-action:none;display:none}
#knob{position:absolute;left:30px;top:30px;width:36px;height:36px;border-radius:50%;background:rgba(243,234,217,.35)}
#veil{position:fixed;inset:0;display:grid;place-items:center;z-index:8;background:#07090c;transition:opacity .5s;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);text-align:center;padding:24px}
#veil.gone{opacity:0;pointer-events:none}
#veil strong{display:block;font-family:var(--display);font-size:34px;letter-spacing:.02em;text-transform:none;color:var(--ink);font-weight:500;margin-bottom:8px}
@media (pointer:coarse){#stick{display:block}.help{display:none}}
@media (max-width:640px){.grp>span{display:none}}
@media (prefers-reduced-motion:reduce){#veil,#hud{transition:none}}
</style>

<canvas id="c"></canvas>
<div class="plate"><h1>Helios Triad</h1><p><b id="bname">Amazon</b> · eleven procedural worlds</p><p id="status" aria-live="polite"></p></div>
<div class="help">WASD move · E/Q rise/sink · Shift fast<br>Drag to look · Double-click mouse-lock · 1–0, − biome · H hide<br>Pick a Touch element, then click the ground (or F) to strike it</div>
<div id="stick"><div id="knob"></div></div>
<div id="hud">
  <div class="grp" id="g-biome"><span>Biome</span></div>
  <div class="grp" id="g-tod"><span>Light</span></div>
  <div class="grp" id="g-wx"><span>Sky</span></div>
  <div class="grp" id="g-q"><span>Quality</span></div>
  <div class="grp" id="g-hand"><span>Touch</span></div>
  <div class="grp" id="g-opt" hidden></div>
  <span id="meta">— fps</span>
  <button id="hide" aria-label="Hide controls">Hide</button>
</div>
<button id="show" hidden>Show controls</button>
<div id="veil"><div><strong id="veilTitle">Helios Triad</strong><span id="veilMsg">Growing the world…</span></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
addEventListener('error', e => { const m=document.getElementById('veilMsg'); if (m) { m.textContent='Could not start the renderer: '+(e.message||'unknown error'); document.getElementById('veil').classList.remove('gone'); } });
</script>
<script type="module">
/* ============================================================================
   HELIOS ENGINE
   A biome is a plug-in registered with Helios.registerBiome({...}):
     id, label                 unique key + HUD label
     sky   {turbidity, rayleigh, mie, mieG}
     fog   {density, tint:[r,g,b]}      FogExp2 density, colour multiplier
     ground [r,g,b]                     hemisphere bounce colour
     camera {pos:[x,y,z], look:[x,y,z]} or a function(kit) returning that
     clouds {cover, base, top, cirrus, dark}  volumetric sky; base/top may sit below the camera (optional)
     precip {kind:'snow'|'ash'|'motes'|'none', color, size, fall, sway, base, storm, rainLines, lightning, additive}
     bounds [cx, cz, radius]            soft limit on where the viewer can travel (optional)
     floor, ceiling                     lowest / highest viewer altitude (default 0 / 1400)
     climate {temp, lapse, night}       air temperature at sea level (deg C), change per metre, night drop (optional)
     options [{key, label, values:[[k,label]...], value}]   extra HUD controls; the world gets setOption(key, k)
     build(kit) -> { group, heightAt(x,z), update?(dt, env), materialAt?(x,z), status?(), setOption?(k,v),
                     onImpact?(element, point, radius), locomote?(S, fwd, right, dt, keys), precip?, fogK? }
   kit gives: THREE, Q (quality), noise, rng, tex, makeTerrain (with horizon apron), makeWater, terrainMaterial,
   instTiled, forest + defineSpecies, scatter + plant geometry builders, puffField, islandGeo, tubeInto,
   smoothstep, lerp, srgb, impact (strike the surface layer). env passed to update() carries night, day, time,
   rain, fog, sunDir, wind [x,z] (m/s) and temp (air temperature at the viewer).
   Every world runs a Dynamic Surface & Environmental State layer (extensions/surface-state): weather, fire,
   frost, water and the other elemental impacts leave wetness, snow, ice, scorch, heat and damage on the ground,
   which terrain, ground cover and trees read back from a texture window around the viewer.
   ========================================================================== */
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { Water } from 'three/addons/objects/Water.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
/* Dynamic Surface & Environmental State layer. Loaded dynamically so the worlds still open from file:// (where browsers
   refuse local module imports); without it the ground still wets and snows from the weather, but nothing is simulated. */
const SurfaceLib = await import('./extensions/surface-state/src/index.mjs').catch(e => { console.warn('surface layer unavailable:', e.message); return null; });

const TAU = Math.PI * 2;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const lerp = (a,b,t) => a + (b-a)*t;
const smoothstep = (a,b,x) => { const t = clamp((x-a)/(b-a), 0, 1); return t*t*(3-2*t); };

/* ---------- Noise ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PERM = new Uint8Array(512);
{ const r = rng(7), p = [...Array(256).keys()]; for (let i=255;i>0;i--){ const j=Math.floor(r()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; } for (let i=0;i<512;i++) PERM[i]=p[i&255]; }
const fade = t => t*t*t*(t*(t*6-15)+10);
function grad(h,x,y){ switch(h&7){case 0:return x+y;case 1:return -x+y;case 2:return x-y;case 3:return -x-y;case 4:return x;case 5:return -x;case 6:return y;default:return -y;} }
function perlin(x,y,per=256){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const X0=((xi%per)+per)%per&255, Y0=((yi%per)+per)%per&255, X1=((X0+1)%per)&255, Y1=((Y0+1)%per)&255;
  const u=fade(xf), v=fade(yf);
  const aa=PERM[PERM[X0]+Y0], ba=PERM[PERM[X1]+Y0], ab=PERM[PERM[X0]+Y1], bb=PERM[PERM[X1]+Y1];
  return lerp(lerp(grad(aa,xf,yf),grad(ba,xf-1,yf),u), lerp(grad(ab,xf,yf-1),grad(bb,xf-1,yf-1),u), v)*0.7;
}
function fbm(x,y,oct=5,per=256){ let s=0,a=0.5,f=1; for(let i=0;i<oct;i++){ s+=a*perlin(x*f,y*f,per*f); f*=2; a*=0.5; } return s; }
function ridged(x,y,oct=4){ let s=0,a=0.5,f=1; for(let i=0;i<oct;i++){ const n=1-Math.abs(perlin(x*f,y*f)); s+=a*n*n; f*=2; a*=0.5; } return s; }
const hash2 = (x,y) => { const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); };
const noise = { perlin, fbm, ridged, hash2 };

/* ---------- Renderer & world ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, logarithmicDepthBuffer:true, powerPreference:'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbfcad6, 0.001);
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.5, 16000);

const sky = new Sky(); sky.scale.setScalar(12000); scene.add(sky);
const envScene = new THREE.Scene(); const envSky = new Sky(); envSky.material = sky.material; envSky.scale.setScalar(80); envScene.add(envSky);
const pmrem = new THREE.PMREMGenerator(renderer); let envRT = null;

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.castShadow = true; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.9;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x3a3020, 0.3); scene.add(hemi);

/* ---------- Quality ---------- */
const DPR = devicePixelRatio || 1;
const QUALITY = {
  fast:     { label:'Fast',     pr:Math.min(DPR,1.75), shadow:1024, ext:110, density:0.35, water:0,    seg:0.55, puffs:4, cards:60,  lod:85,  leafShadow:false, cardK:0.6,  impRes:192, cloud:18 },
  balanced: { label:'Balanced', pr:Math.min(DPR,2),    shadow:2048, ext:170, density:0.75, water:1024, seg:0.8,  puffs:6, cards:90,  lod:150, leafShadow:true,  cardK:0.85, impRes:320, cloud:28 },
  ultra:    { label:'Ultra',    pr:Math.min(DPR,2.5),  shadow:4096, ext:230, density:1.0,  water:2048, seg:1.0,  puffs:7, cards:130, lod:240, leafShadow:true,  cardK:1.0,  impRes:448, cloud:40 }
};
let qKey = matchMedia('(pointer:coarse)').matches ? 'fast' : 'balanced';
let Q = QUALITY[qKey];
function applyQuality(){
  sun.shadow.mapSize.set(Q.shadow, Q.shadow);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  const e = Q.ext, c = sun.shadow.camera; c.left=-e; c.right=e; c.top=e; c.bottom=-e; c.near=1; c.far=1600; c.updateProjectionMatrix();
  resize();
}
function resize(){
  renderer.setPixelRatio(Q.pr);
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ---------- Procedural textures ---------- */
function canvasTex(w, h, fn, { srgb=true } = {}){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d'); const img = g.createImageData(w,h); const d = img.data;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ const o=(y*w+x)*4; const v=fn(x/w,y/h); d[o]=v[0]; d[o+1]=v[1]; d[o+2]=v[2]; d[o+3]=v[3]??255; }
  g.putImageData(img,0,0); return finishTex(new THREE.CanvasTexture(c), srgb);
}
function finishTex(t, srgb=true){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy=MAX_ANISO; t.userData.keep=true; return t; }

const tex = {};
tex.waterNormals = (() => {
  const S=512, H=(u,v)=>fbm(u*8,v*8,5,8), e=1/S;
  return canvasTex(S,S,(u,v)=>{ const dx=(H(u+e,v)-H(u-e,v))*14, dy=(H(u,v+e)-H(u,v-e))*14; const l=Math.hypot(dx,dy,1); return [(-dx/l*0.5+0.5)*255,(-dy/l*0.5+0.5)*255,(1/l*0.5+0.5)*255]; }, { srgb:false });
})();
tex.ground = canvasTex(256,256,(u,v)=>{ const n=0.86+0.14*fbm(u*16,v*16,5,16) + (hash2(u*256,v*256)-0.5)*0.06; const g=clamp(n,0,1)*255; return [g,g,g]; });
tex.bark = canvasTex(64,256,(u,v)=>{ const n=0.78+0.22*fbm(u*4,v*28,4,4)+0.08*Math.sin(v*120+perlin(u*8,v*8)*3); const g=clamp(n,0,1)*255; return [g,g,g]; });
tex.cloud = (() => {
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d'); const r=rng(9);
  for (let i=0;i<34;i++){ const x=60+r()*136, y=90+r()*80, rad=24+r()*46; const gr=g.createRadialGradient(x,y,0,x,y,rad); gr.addColorStop(0,'rgba(255,255,255,.55)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,256,256); }
  return finishTex(new THREE.CanvasTexture(c));
})();
tex.glow = (() => { const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.25,'rgba(255,200,120,.6)'); gr.addColorStop(1,'rgba(255,140,40,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); return finishTex(new THREE.CanvasTexture(c)); })();

/* ---------- Wind (shared vertex sway for foliage) ---------- */
const WIND = { value: new THREE.Vector2(0, 1) };
function addWind(mat, amp){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uWind = WIND;
    sh.vertexShader = 'uniform vec2 uWind;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        vec3 ip = instanceMatrix[3].xyz;
      #else
        vec3 ip = vec3(0.0);
      #endif
      float sw = sin(uWind.x*1.1 + ip.x*0.071 + ip.z*0.053) + 0.45*sin(uWind.x*2.9 + ip.z*0.13 + ip.x*0.02);
      float hh = max(position.y, 0.0);
      transformed.x += sw * ${amp.toFixed(3)} * uWind.y * hh;
      transformed.z += sw * ${(amp*0.6).toFixed(3)} * uWind.y * hh;`);
  };
  mat.customProgramCacheKey = () => 'wind' + amp;
  return mat;
}

/* ---------- Building blocks ---------- */
const srgb = (c, r, g, b) => c.setRGB(r, g, b, THREE.SRGBColorSpace);
function keep(m){ m.userData.keep = true; return m; }
function keepG(g){ g.userData.keep = true; return g; }

/* Terrain shading: world-space noise keeps vertex colour from reading as flat. Albedo breakup at three
   scales, slope-driven strata rock, wet shoreline, wind-rippled sand, crop rows, shoreline foam and
   underwater caustics. The per-pixel bump is an analytic finite-difference perturbation of the same noise. */
const NOISE2D = `
float th21(vec2 p){ vec3 q = fract(vec3(p.xyx)*0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y)*q.z); }
float tvn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
  return mix(mix(th21(i), th21(i + vec2(1.0,0.0)), f.x), mix(th21(i + vec2(0.0,1.0)), th21(i + vec2(1.0,1.0)), f.x), f.y); }
float tfbm(vec2 p){ float s = 0.0, a = 0.5; for (int i=0;i<4;i++){ s += a*tvn(p); p = p*2.03 + 17.3; a *= 0.5; } return s; }
float tbump(vec2 p, float n3, float f0, float f1, float f2, float rpA, float cpA){
  float h = 0.6*tvn(p*2.3)*f0 + 0.3*tvn(p*9.0)*f1 + 0.1*tvn(p*37.0)*f2;
  if (rpA > 0.0){ float ph = dot(p, vec2(0.88, 0.47))*5.5 + n3*10.0 + tvn(p*0.3)*6.0; float r = 1.0 - abs(sin(ph)); h += rpA*r*r*f0; }
  if (cpA > 0.0) h += cpA*1.3*(0.5 + 0.5*sin(p.x*8.4 + n3*3.0 + p.y*0.15))*f0;
  return h;
}
`;
/* ---------- Surface state window: the simulated ground around the viewer as two RGBA textures ----------
   A: wetness, snow, ice, scorch    B: heat (live fire), damage (lost integrity), growth, coverage.
   Cell values are premultiplied by coverage, so the shader blends them over the ambient weather field exactly;
   the ambient field splits into rain-wet or snow by the local air temperature (uSurfClim: sea-level deg C, lapse). */
const SURF_N = 128;
const SU = { uSurfA:{ value:null }, uSurfB:{ value:null }, uSurfWin:{ value:new THREE.Vector4(0, 0, 384, 0) },
  uSurfAmb:{ value:new THREE.Vector4() }, uSurfClim:{ value:new THREE.Vector4(18, -0.0065, 0, 0) } };
for (const k of ['uSurfA', 'uSurfB']){ const t = new THREE.DataTexture(new Uint8Array(SURF_N*SURF_N*4), SURF_N, SURF_N, THREE.RGBAFormat);
  t.magFilter = t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; t.needsUpdate = true; t.userData.keep = true; SU[k].value = t; }
const SURF_GLSL = `
uniform sampler2D uSurfA, uSurfB; uniform vec4 uSurfWin, uSurfAmb, uSurfClim;
void surfAt(vec3 wp, out vec4 A, out vec4 B){
  vec2 uv = (wp.xz - uSurfWin.xy)/uSurfWin.z;
  float inW = uSurfWin.w*step(0.0, uv.x)*step(uv.x, 1.0)*step(0.0, uv.y)*step(uv.y, 1.0);
  vec4 a = texture2D(uSurfA, uv)*inW; B = texture2D(uSurfB, uv)*inW;
  float frz = 1.0 - smoothstep(-0.5, 1.5, uSurfClim.x + uSurfClim.y*wp.y);
  A = vec4(uSurfAmb.x*(1.0 - frz), uSurfAmb.y*frz, uSurfAmb.z*frz, 0.0)*(1.0 - B.a) + a;
}
`;
function terrainMaterial(d = {}){
  const o = { rock:[0.42,0.38,0.34], rockLo:0.3, bump:14, ripple:0, wet:0.5, foam:0, caustic:0, rows:0, grain:1, snow:0, glow:0, glowCol:[1.0,0.32,0.06], strata:1, ...d };
  const rc = new THREE.Color().setRGB(o.rock[0], o.rock[1], o.rock[2], THREE.SRGBColorSpace);
  const U = { uRock:{ value:new THREE.Vector4(rc.r, rc.g, rc.b, o.rockLo) }, uTD:{ value:new THREE.Vector4(o.bump, o.ripple, o.wet, o.rows) },
    uTE:{ value:new THREE.Vector3(o.foam, o.caustic, o.grain) }, uTF:{ value:new THREE.Vector3(o.snow, o.glow, o.strata) }, uGlowC:{ value:new THREE.Color(...o.glowCol) },
    uT:WIND, uSunView:VU.uSunView, uSunCol:VU.uSunCol, ...SU };
  const m = new THREE.MeshStandardMaterial({ vertexColors:true, map:tex.ground, roughness:0.95, metalness:0 });
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = 'attribute float kind; varying vec3 vWP; varying vec3 vWN; varying float vKind;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vWP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normalize(mat3(modelMatrix) * objectNormal); vKind = kind;`);
    sh.fragmentShader = 'uniform vec4 uRock, uTD; uniform vec3 uTE, uGlowC, uSunView, uSunCol; uniform vec2 uT; uniform vec3 uTF; varying vec3 vWP; varying vec3 vWN; varying float vKind;\n' + NOISE2D + SURF_GLSL + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec2 twp = vWP.xz;
        float n3 = tfbm(twp*0.045), n1 = tvn(twp*1.1), n2 = tvn(twp*5.3 + 4.1), n4 = tvn(twp*23.0);
        float slope = 1.0 - clamp(vWN.y, 0.0, 1.0);

/* Billowing puffs (volcanic plumes, fumarole steam, sea smoke): camera-facing quads animated entirely on the

function puffField(o){

      uSize:{ value:new THREE.Vector2(...o.size) }, uDrift:{ value:new THREE.Vector3(...(o.drift || [0,0,0])) }, uOpacity:{ value:o.opacity ?? 0.8 },
      uColA:{ value:new THREE.Color(...o.colA) }, uColB:{ value:new THREE.Color(...o.colB) }, uGlow:{ value:new THREE.Color(...(o.glow || [0,0,0])) }, uGlowK:{ value:1 } }]),

/* Ice that glows from inside: standard PBR plus a cold scattering term that rises toward grazing angles
   and when the sun is behind the ice. */
function iceMaterial(rough = 0.2){
  const m = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:rough, metalness:0, envMapIntensity:1.15 });
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, { uSunView:VU.uSunView, uSunCol:VU.uSunCol, uHemiSky:VU.uHemiSky });
    sh.fragmentShader = 'uniform vec3 uSunView, uSunCol, uHemiSky;\n' + sh.fragmentShader.replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
      { vec3 Vd = normalize(vViewPosition); float fr = pow(1.0 - abs(dot(normal, Vd)), 2.0), bs = pow(clamp(dot(-Vd, uSunView), 0.0, 1.0), 3.0);
        reflectedLight.indirectDiffuse += vec3(0.1, 0.42, 0.58) * diffuseColor.rgb * (uHemiSky*(0.18 + 0.35*fr) + uSunCol*(0.05 + 0.5*bs)); }`);
  };
  m.customProgramCacheKey = () => 'ice' + rough;
  return m;
}

  const col = new Float32Array(p.count*3), snow = lin(0.95,0.97,1.0), ice = lin(0.66,0.86,0.94), deep = lin(0.18,0.52,0.7);
  for (let i=0;i<p.count;i++){

/* ============================== ALPINE ============================== */
/* Alpine valley: a U-shaped trough climbing north to a glacier under a cirque headwall, meadow shoulders, a scree
   apron at the foot of 400 m limestone walls and ridged peaks beyond. A rock bar (riegel) crosses the valley with a
   gorge cut through it by the glacial stream; a rope bridge spans the gorge. Module-scope so the camera preset can
   sample the ground before the world is built. Heights are scaled: the status adds 1,450 m to read as altitude. */
/* Relief of the crag's climbing face: broad bulges, protruding ledge bands and vertical cracks */
const alpineFaceD = (y, z) => 2.4*fbm(y*0.05 + 3, z*0.05, 3) + 1.5*Math.pow(Math.max(0, Math.sin(y*0.42 + 2.5*perlin(z*0.04, y*0.05))), 4)
  - 1.2*Math.pow(1 - Math.abs(Math.sin(z*0.21 + 1.5*perlin(y*0.03, z*0.02))), 12) + 0.35*perlin(y*0.5, z*0.5);
/* Meadow flower swathes: >0 buttercup, <0 gentian and heather; shared by the terrain colour and the flower scatter */
const alpineFlowerAt = (x, z) => { const a = smoothstep(0.6, 0.82, 0.5 + 0.5*perlin(x*0.02 + 5, z*0.02)); return { y:a*(perlin(x*0.004 + 13, z*0.004) > 0 ? 1 : -1) }; };
const alpineT = (() => {
  const zB = -60, zc = 130;
  const vx = z => 70*Math.sin(z*0.0016 + 0.4) + 25*Math.sin(z*0.0047);
  const sx = z => vx(z) + 10*Math.sin(z*0.011);                                   // stream line
  const bar = z => smoothstep(zB - 30, zB - 90, z);                                // upper valley floor, north of the riegel
  const floorH = z => 40 + 150*smoothstep(600, -2400, z) + 42*bar(z);
  // the riegel: a flat-topped rock bar 70 m above the lower floor, cliffed on its south face; the stream drops through
  // a slot gorge cut into it (the step in floorH falls inside the gorge, just upstream of the bridge)
  const crest = z => (70 - 42*bar(z))*smoothstep(zB + 95, zB + 40, z)*smoothstep(zB - 160, zB - 70, z);
  const hdS = z => 900*smoothstep(-1750, -3050, z);
  const wallAt = z => 540 + 60*perlin(z*0.003, 1.7);
  const gorgeK = z => smoothstep(zB - 170, zB - 110, z)*(1 - smoothstep(zB + 90, zB + 150, z));
  const chW = z => 7 + 3*Math.sin(z*0.013);
  const waterY = z => floorH(z) - 0.9;
  const glacier = (x,z) => { const d = Math.abs(x - vx(z)), w = 170 + 110*smoothstep(-1700, -2500, z) + 25*perlin(z*0.006, 3.3); return { m:(1 - smoothstep(0.42*w, 1.1*w, d))*smoothstep(-1560, -1680, z), q:d/w }; };

    const ad = Math.abs(x - vx(z)), wS = wallAt(z), gl = 0.5 + 0.5*Math.sin(z*0.009 + x*0.002 + 2.5*perlin(z*0.004, x*0.001 + 3));
    const mtn = 900*Math.pow(ridged(x*0.0012 + 3, z*0.0012, 5), 1.7) + 150*ridged(x*0.004 + 1, z*0.004 + 5, 4);
    return floorH(z) + crest(z)
      + 75*smoothstep(50, 340, ad)*(0.7 + 0.45*perlin(x*0.004 + 2, z*0.004))                          // meadow shoulders
      + 45*smoothstep(wS - 200, wS - 80, ad)                                                           // scree apron
      + 230*smoothstep(wS - 90, wS + 110, ad)*(0.75 + 0.5*ridged(x*0.005, z*0.005 + 5, 3))             // trough wall, scored by couloirs
      + 120*smoothstep(wS + 25, wS + 52, ad)*smoothstep(0.35, 0.65, gl)                                // sheer cliff bands
      + mtn*smoothstep(wS - 50, wS + 650, ad)                                                          // the peaks
      + hdS(z)*(0.55 + 0.7*ridged(x*0.002 + 7, z*0.002, 4))                                           // cirque headwall
      + 45*ridged(x*0.011 + 9, z*0.011, 3)*smoothstep(wS - 50, wS + 300, ad)                          // ribs and gullies on the faces
      + 7*ridged(x*0.018, z*0.018, 3)*smoothstep(30, 200, ad) + 3*fbm(x*0.03, z*0.03, 3);

  const cragTop = (x,z) => yt + 3*fbm(x*0.03, z*0.03, 3) - 12*smoothstep(34, 55, Math.abs(z - zc)) - 18*smoothstep(xW - 22, xW - 58, x);

  const xa = sx(zB) - 31, xb = sx(zB) + 31, ya = ground(xa, zB) + 0.4, yb2 = ground(xb, zB) + 0.4, sag = 3.2;

}

/* ============================== HUD ============================== */

    b.onclick=()=>{ on(key); g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); }; g.appendChild(b); });
}
const cap = s => s[0].toUpperCase()+s.slice(1);
const startId = BIOMES.some(b=>b.id===location.hash.slice(1)) ? location.hash.slice(1) : BIOMES[0].id;
hudGroup('g-biome', BIOMES.map(b=>[b.id,b.label]), startId, id => loadBiome(id));
hudGroup('g-tod', Object.keys(TOD).map(k=>[k,cap(k)]), 'dusk', k => S.tSun=[...TOD[k]]);
hudGroup('g-wx', Object.keys(WX).map(k=>[k,cap(k)]), 'clear', k => S.tWx=[...WX[k]]);
hudGroup('g-q', Object.keys(QUALITY).map(k=>[k,QUALITY[k].label]), qKey, k => { qKey=k; Q=QUALITY[k]; applyQuality(); loadBiome(activeDef.id); });
hudGroup('g-hand', [['look','Look'],['fire','Fire'],['frost','Frost'],['water','Water'],['storm','Storm'],['nature','Grow'],['force','Force']], 'look', k => { S.hand = k; canvas.style.cursor = k === 'look' ? '' : 'crosshair'; });
/* Per-world controls (e.g. the forest's seasons), rebuilt whenever a world loads */
function biomeOptions(def){
  const g = document.getElementById('g-opt'); g.replaceChildren(); g.hidden = !def.options?.length;
  for (const o of def.options || []){ const sp = document.createElement('span'); sp.textContent = o.label; g.appendChild(sp);
    for (const [k, label] of o.values){ const b = document.createElement('button'); b.textContent = label; b.dataset.k = k; b.setAttribute('aria-pressed', k === o.value);
      b.onclick = () => { o.value = k; active.setOption?.(o.key, k); g.querySelectorAll('button').forEach(x => { if (o.values.some(v => v[0] === x.dataset.k)) x.setAttribute('aria-pressed', x === b); }); }; g.appendChild(b); }
    active.setOption?.(o.key, o.value); }
}
const hud=document.getElementById('hud'), show=document.getElementById('show');
function toggleHud(){ const off=!hud.classList.toggle('off'); show.hidden=off; }
document.getElementById('hide').onclick=toggleHud; show.onclick=toggleHud;

/* ============================== INPUT ============================== */
addEventListener('keydown', e => { S.keys[e.code]=true; if (e.code==='KeyH') toggleHud();
  if (e.code==='KeyF' && !e.repeat) touchAt(0, 0);
  const n = e.code==='Minus' ? 10 : /^Digit\d$/.test(e.code) ? (+e.code.slice(5) + 9) % 10 : -1;   // 1-9, 0, minus
  if (n>=0 && n<BIOMES.length) document.querySelector(`#g-biome [data-k="${BIOMES[n].id}"]`).click(); });
addEventListener('keyup', e => S.keys[e.code]=false);
addEventListener('blur', () => S.keys={});
let drag=null, press=null;
canvas.addEventListener('pointerdown', e => { drag={x:e.clientX,y:e.clientY,id:e.pointerId}; press={x:e.clientX,y:e.clientY,t:performance.now()}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', e => { drag=null;
  // a click (not a drag) with a Touch element selected strikes the ground under the pointer
  if (press && S.hand !== 'look' && Math.hypot(e.clientX-press.x, e.clientY-press.y) < 6 && performance.now()-press.t < 500){
    const locked = document.pointerLockElement===canvas, r = canvas.getBoundingClientRect();
    touchAt(locked ? 0 : (e.clientX-r.left)/r.width*2-1, locked ? 0 : -((e.clientY-r.top)/r.height*2-1)); }
  press=null; });
/* Ray-march the height field from the camera through a screen point, then bisect onto the surface */
const _ray = new THREE.Raycaster();

  let t0 = 0, t = 0.5;
  while (t < 1500){ P.copy(o).addScaledVector(d, t); if (P.y <= active.heightAt(P.x, P.z)){ for (let i=0;i<14;i++){ const tm = (t0 + t)/2; P.copy(o).addScaledVector(d, tm); if (P.y <= active.heightAt(P.x, P.z)) t = tm; else t0 = tm; } P.copy(o).addScaledVector(d, t); return P; }

function touchAt(nx, ny){ if (S.hand === 'look' || !active) return; const p = pickGround(nx, ny); if (p) strike(S.hand, p); }
canvas.addEventListener('pointermove', e => {
  const locked = document.pointerLockElement===canvas;
  if (!locked && (!drag || drag.id!==e.pointerId)) return;

}
applyQuality();
loadBiome(startId);
