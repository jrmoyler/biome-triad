<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helios Triad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed world, one glass instrument strip docked bottom, title plate top-left */
:root{--ink:#f3ead9;--mute:#a59c8b;--glass:rgba(14,12,10,.58);--line:rgba(243,234,217,.14);--sun:#e7a64a;--display:"Cormorant Garamond",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:#07090c;color:var(--ink);font-family:var(--mono);-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.plate{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:5;pointer-events:none}
.plate h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,40px);letter-spacing:.02em;margin:0;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.plate p{margin:6px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.plate b{color:var(--sun);font-weight:500}
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center;max-width:calc(100vw - 32px);padding:8px 12px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;transition:opacity .2s,transform .2s}
#hud.off{opacity:0;pointer-events:none;transform:translate(-50%,12px)}
.grp{display:flex;align-items:center;gap:2px}
.grp>span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-right:4px}
button{font:500 11px/1 var(--mono);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer}
button:hover{background:rgba(243,234,217,.08)}
button:focus-visible{outline:1px solid var(--sun);outline-offset:1px}
button[aria-pressed="true"]{background:var(--sun);color:#1a1208}
#meta{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:9ch;text-align:right}
#show{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--glass);border:1px solid var(--line)}
.help{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;font-size:10px;line-height:1.7;color:var(--mute);text-align:right;pointer-events:none}
#stick{position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:1px solid var(--line);background:rgba(14,12,10,.3);z-index:6;touch-action:none;display:none}
#knob{position:absolute;left:30px;top:30px;width:36px;height:36px;border-radius:50%;background:rgba(243,234,217,.35)}
#veil{position:fixed;inset:0;display:grid;place-items:center;z-index:8;background:#07090c;transition:opacity .5s;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);text-align:center;padding:24px}
#veil.gone{opacity:0;pointer-events:none}
#veil strong{display:block;font-family:var(--display);font-size:34px;letter-spacing:.02em;text-transform:none;color:var(--ink);font-weight:500;margin-bottom:8px}
@media (pointer:coarse){#stick{display:block}.help{display:none}}
@media (max-width:640px){.grp>span{display:none}}
@media (prefers-reduced-motion:reduce){#veil,#hud{transition:none}}
</style>

<canvas id="c"></canvas>
<div class="plate"><h1>Helios Triad</h1><p><b id="bname">Amazon</b> · procedural biome world</p></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
addEventListener('error', e => { const m=document.getElementById('veilMsg'); if (m) { m.textContent='Could not start the renderer: '+(e.message||'unknown error'); document.getElementById('veil').classList.remove('gone'); } });
</script>
<script type="module">
/* ============================================================================
   HELIOS ENGINE
   A biome is a plug-in registered with Helios.registerBiome({...}):
     id, label                 unique key + HUD label
     sky   {turbidity, rayleigh, mie, mieG}
     fog   {density, tint:[r,g,b]}      FogExp2 density, colour multiplier
     ground [r,g,b]                     hemisphere bounce colour
     camera {pos:[x,y,z], look:[x,y,z]} or a function(kit) returning that
     build(kit) -> { group, heightAt(x,z), update?(dt, env) }
   kit gives: THREE, Q (quality), noise, rng, tex, makeTerrain, makeWater,
   instTiled, flora (crowns, palms, rocks, boats), smoothstep, lerp, srgb.
   ========================================================================== */
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { Water } from 'three/addons/objects/Water.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const TAU = Math.PI * 2;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const lerp = (a,b,t) => a + (b-a)*t;
const smoothstep = (a,b,x) => { const t = clamp((x-a)/(b-a), 0, 1); return t*t*(3-2*t); };

/* ---------- Noise ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PERM = new Uint8Array(512);
{ const r = rng(7), p = [...Array(256).keys()]; for (let i=255;i>0;i--){ const j=Math.floor(r()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; } for (let i=0;i<512;i++) PERM[i]=p[i&255]; }
const fade = t => t*t*t*(t*(t*6-15)+10);
function grad(h,x,y){ switch(h&7){case 0:return x+y;case 1:return -x+y;case 2:return x-y;case 3:return -x-y;case 4:return x;case 5:return -x;case 6:return y;default:return -y;} }
function perlin(x,y,per=256){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const X0=((xi%per)+per)%per&255, Y0=((yi%per)+per)%per&255, X1=((X0+1)%per)&255, Y1=((Y0+1)%per)&255;
  const u=fade(xf), v=fade(yf);
  const aa=PERM[PERM[X0]+Y0], ba=PERM[PERM[X1]+Y0], ab=PERM[PERM[X0]+Y1], bb=PERM[PERM[X1]+Y1];
  return lerp(lerp(grad(aa,xf,yf),grad(ba,xf-1,yf),u), lerp(grad(ab,xf,yf-1),grad(bb,xf-1,yf-1),u), v)*0.7;
}
function fbm(x,y,oct=5,per=256){ let s=0,a=0.5,f=1; for(let i=0;i<oct;i++){ s+=a*perlin(x*f,y*f,per*f); f*=2; a*=0.5; } return s; }
function ridged(x,y,oct=4){ let s=0,a=0.5,f=1; for(let i=0;i<oct;i++){ const n=1-Math.abs(perlin(x*f,y*f)); s+=a*n*n; f*=2; a*=0.5; } return s; }
const hash2 = (x,y) => { const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); };
const noise = { perlin, fbm, ridged, hash2 };

/* ---------- Renderer & world ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, logarithmicDepthBuffer:true, powerPreference:'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbfcad6, 0.001);
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.5, 16000);

const sky = new Sky(); sky.scale.setScalar(12000); scene.add(sky);
const envScene = new THREE.Scene(); const envSky = new Sky(); envSky.material = sky.material; envSky.scale.setScalar(80); envScene.add(envSky);
const pmrem = new THREE.PMREMGenerator(renderer); let envRT = null;

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.castShadow = true; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.9;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x3a3020, 0.3); scene.add(hemi);

/* ---------- Quality ---------- */
const DPR = devicePixelRatio || 1;
const QUALITY = {
  fast:     { label:'Fast',     pr:Math.min(DPR,1.75), shadow:1024, ext:110, density:0.35, water:0,    seg:0.55, puffs:4, cards:60,  lod:85,  leafShadow:false, cardK:0.6,  impRes:192 },
  balanced: { label:'Balanced', pr:Math.min(DPR,2),    shadow:2048, ext:170, density:0.75, water:1024, seg:0.8,  puffs:6, cards:90,  lod:150, leafShadow:true,  cardK:0.85, impRes:320 },
  ultra:    { label:'Ultra',    pr:Math.min(DPR,2.5),  shadow:4096, ext:230, density:1.0,  water:2048, seg:1.0,  puffs:7, cards:130, lod:240, leafShadow:true,  cardK:1.0,  impRes:448 }
};
let qKey = matchMedia('(pointer:coarse)').matches ? 'fast' : 'balanced';
let Q = QUALITY[qKey];
let dynScale = 1;
function applyQuality(){
  sun.shadow.mapSize.set(Q.shadow, Q.shadow);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  const e = Q.ext, c = sun.shadow.camera; c.left=-e; c.right=e; c.top=e; c.bottom=-e; c.near=1; c.far=1600; c.updateProjectionMatrix();
  resize();
}
function resize(){
  renderer.setPixelRatio(Q.pr * dynScale);
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ---------- Procedural textures ---------- */
function canvasTex(w, h, fn, { srgb=true } = {}){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d'); const img = g.createImageData(w,h); const d = img.data;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ const o=(y*w+x)*4; const v=fn(x/w,y/h); d[o]=v[0]; d[o+1]=v[1]; d[o+2]=v[2]; d[o+3]=v[3]??255; }
  g.putImageData(img,0,0); return finishTex(new THREE.CanvasTexture(c), srgb);
}
function finishTex(t, srgb=true){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy=MAX_ANISO; t.userData.keep=true; return t; }

const tex = {};
tex.waterNormals = (() => {
  const S=512, H=(u,v)=>fbm(u*8,v*8,5,8), e=1/S;
  return canvasTex(S,S,(u,v)=>{ const dx=(H(u+e,v)-H(u-e,v))*14, dy=(H(u,v+e)-H(u,v-e))*14; const l=Math.hypot(dx,dy,1); return [(-dx/l*0.5+0.5)*255,(-dy/l*0.5+0.5)*255,(1/l*0.5+0.5)*255]; }, { srgb:false });
})();
tex.ground = canvasTex(256,256,(u,v)=>{ const n=0.86+0.14*fbm(u*16,v*16,5,16) + (hash2(u*256,v*256)-0.5)*0.06; const g=clamp(n,0,1)*255; return [g,g,g]; });
tex.leaf = canvasTex(256,256,(u,v)=>{ const n=fbm(u*12,v*12,4,12); const s=hash2(Math.floor(u*90),Math.floor(v*90)); const g=clamp(0.78+n*0.45-(s>0.86?0.35:0),0.25,1)*255; return [g,g,g]; });
tex.leaf.repeat.set(2,2);
tex.leafCluster = (() => {
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d'); const r=rng(61);
  for (let i=0;i<78;i++){
    const a=r()*TAU, d=Math.sqrt(r())*94, x=128+Math.cos(a)*d, y=128+Math.sin(a)*d;
    const len=16+r()*17, w=len*(0.36+r()*0.14), rot=a+(r()-0.5)*1.3, l=48+r()*44, h=86+r()*24;
    g.save(); g.translate(x,y); g.rotate(rot);
    const gr=g.createLinearGradient(-len,0,len,0); gr.addColorStop(0,`hsl(${h},16%,${l-22}%)`); gr.addColorStop(1,`hsl(${h},12%,${l}%)`);
    g.fillStyle=gr; g.beginPath(); g.ellipse(0,0,len,w,0,0,TAU); g.fill();
    g.strokeStyle='rgba(20,30,10,.35)'; g.lineWidth=1.2; g.beginPath(); g.moveTo(-len*0.9,0); g.lineTo(len*0.9,0); g.stroke();
    g.restore();
  }
  return finishTex(new THREE.CanvasTexture(c));
})();
tex.bark = canvasTex(64,256,(u,v)=>{ const n=0.78+0.22*fbm(u*4,v*28,4,4)+0.08*Math.sin(v*120+perlin(u*8,v*8)*3); const g=clamp(n,0,1)*255; return [g,g,g]; });
tex.frond = (() => {
  const c=document.createElement('canvas'); c.width=128; c.height=512; const g=c.getContext('2d'); const r=rng(3);
  g.lineCap='round';
  for (let y=496;y>12;y-=7){ const t=1-y/512; const len=10+58*Math.sin(Math.PI*Math.min(1,t*1.1)); for (const s of [-1,1]){ g.strokeStyle=`hsl(${78+r()*18},${45+r()*20}%,${30+r()*14}%)`; g.lineWidth=3.2+r()*1.5; g.beginPath(); g.moveTo(64,y); g.quadraticCurveTo(64+s*len*0.5,y-6,64+s*len,y-18-r()*8); g.stroke(); } }
  g.strokeStyle='#6d6a3a'; g.lineWidth=4; g.beginPath(); g.moveTo(64,512); g.lineTo(64,6); g.stroke();
  return finishTex(new THREE.CanvasTexture(c));
})();
tex.cloud = (() => {
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d'); const r=rng(9);
  for (let i=0;i<34;i++){ const x=60+r()*136, y=90+r()*80, rad=24+r()*46; const gr=g.createRadialGradient(x,y,0,x,y,rad); gr.addColorStop(0,'rgba(255,255,255,.55)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,256,256); }
  return finishTex(new THREE.CanvasTexture(c));
})();
tex.glow = (() => { const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.25,'rgba(255,200,120,.6)'); gr.addColorStop(1,'rgba(255,140,40,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); return finishTex(new THREE.CanvasTexture(c)); })();

/* ---------- Wind (shared vertex sway for foliage) ---------- */
const WIND = { value: new THREE.Vector2(0, 1) };
function addWind(mat, amp){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uWind = WIND;
    sh.vertexShader = 'uniform vec2 uWind;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        vec3 ip = instanceMatrix[3].xyz;
      #else
        vec3 ip = vec3(0.0);
      #endif
      float sw = sin(uWind.x*1.1 + ip.x*0.071 + ip.z*0.053) + 0.45*sin(uWind.x*2.9 + ip.z*0.13 + ip.x*0.02);
      float hh = max(position.y, 0.0);
      transformed.x += sw * ${amp.toFixed(3)} * uWind.y * hh;
      transformed.z += sw * ${(amp*0.6).toFixed(3)} * uWind.y * hh;`);
  };
  mat.customProgramCacheKey = () => 'wind' + amp;
  return mat;
}

/* ---------- Building blocks ---------- */
const srgb = (c, r, g, b) => c.setRGB(r, g, b, THREE.SRGBColorSpace);
function keep(m){ m.userData.keep = true; return m; }
function keepG(g){ g.userData.keep = true; return g; }

function makeTerrain({ size, seg, height, color, cx=0, cz=0, repeat }){
  seg = Math.max(64, Math.round(seg * Q.seg));
  const g = new THREE.PlaneGeometry(size, size, seg, seg); g.rotateX(-Math.PI/2); g.translate(cx, 0, cz);
  const p = g.attributes.position;
  for (let i=0;i<p.count;i++) p.setY(i, height(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  const n = g.attributes.normal, col = new Float32Array(p.count*3), c = new THREE.Color();
  for (let i=0;i<p.count;i++){ color(c, p.getX(i), p.getY(i), p.getZ(i), n.getY(i)); col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const uv = g.attributes.uv, rep = repeat ?? size/7;
  for (let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*rep, uv.getY(i)*rep);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors:true, map:tex.ground, roughness:0.96, metalness:0 }));
  m.receiveShadow = true; m.castShadow = true;
  return m;
}

const waters = [];
function makeWater({ size, color, distortion=2.5, scale=3, alpha=1, cx=0, cz=0 }){
  if (!Q.water){
    const nm = tex.waterNormals.clone(); nm.userData = {}; nm.repeat.set(size/40, size/40); nm.needsUpdate = true;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshStandardMaterial({
      color, roughness:0.06, metalness:0.1, normalMap:nm, normalScale:new THREE.Vector2(0.35*distortion/2.5, 0.35*distortion/2.5),
      transparent:alpha<1, opacity:alpha, depthWrite:alpha>=1, envMapIntensity:1.2 }));
    m.rotation.x = -Math.PI/2; m.position.set(cx, 0, cz); m.receiveShadow = true; m.userData.cheap = true;
    waters.push(m); return m;
  }
  const w = new Water(new THREE.PlaneGeometry(size, size), {
    textureWidth:Q.water, textureHeight:Q.water, waterNormals:tex.waterNormals,
    sunDirection:new THREE.Vector3(0,1,0), sunColor:0xffffff, waterColor:color, distortionScale:distortion, fog:true, alpha
  });
  w.rotation.x = -Math.PI/2; w.position.set(cx, 0, cz);
  w.material.uniforms.size.value = scale;
  if (alpha < 1) { w.material.transparent = true; w.material.depthWrite = false; }
  waters.push(w);
  return w;
}

/* Instanced meshes binned into spatial tiles so the GPU frustum-culls them */
function instTiled(geo, mat, list, { tile=240, shadow=true, depth=null } = {}){
  const grp = new THREE.Group(), bins = new Map(), d = new THREE.Object3D();
  for (const it of list){ const k = Math.floor(it.p.x/tile)+','+Math.floor(it.p.z/tile); if (!bins.has(k)) bins.set(k, []); bins.get(k).push(it); }
  for (const arr of bins.values()){
    const m = new THREE.InstancedMesh(geo, mat, arr.length);
    arr.forEach((it,i) => { d.position.copy(it.p); d.rotation.set(it.rx||0, it.ry||0, it.rz||0); d.scale.copy(it.s); d.updateMatrix(); m.setMatrixAt(i, d.matrix); if (it.c) m.setColorAt(i, it.c); });
    m.castShadow = shadow; m.receiveShadow = true; if (depth) m.customDepthMaterial = depth;
    m.computeBoundingSphere(); grp.add(m);
  }
  return grp;
}

/* Flora kit — cached per quality level */
const flora = {
  _cache: {},
  _key(k){ return k + '|' + qKey; },
  palmHead(){
    const k=this._key('palmHead'); if (this._cache[k]) return this._cache[k];
    const parts=[], N=12, r=rng(44);
    for (let i=0;i<N;i++){
      const g = new THREE.PlaneGeometry(1.15, 4.4, 1, 10); g.translate(0, 2.2, 0);
      const p = g.attributes.position;
      for (let j=0;j<p.count;j++){ const t=p.getY(j)/4.4; p.setZ(j, t*t*2.4); p.setX(j, p.getX(j)*(1-t*0.35)); }
      g.rotateX(0.85 + r()*0.55); g.rotateY(i/N*TAU + r()*0.3); parts.push(g);
    }
    const m = mergeGeometries(parts); m.computeVertexNormals(); m.userData.keep = true;
    return this._cache[k] = m;
  },
  palmMat(){ const k=this._key('palmMat'); return this._cache[k] ??= keep(addWind(new THREE.MeshStandardMaterial({ map:tex.frond, alphaTest:0.45, side:THREE.DoubleSide, roughness:0.75 }), 0.03)); },
  palmDepth(){ const k=this._key('palmDepth'); return this._cache[k] ??= keep(new THREE.MeshDepthMaterial({ depthPacking:THREE.RGBADepthPacking, map:tex.frond, alphaTest:0.45, side:THREE.DoubleSide })); },

  build:()=>genPalm({ h:13, r:0.36, base:0.5, lean:0.06, n:36, frond:5.0, fw:1.25, elLow:-0.25, elHigh:1.25, droop:0.32, fold:0.5 }, 707) });
defineSpecies('coconut', { seed:808, baseH:15, bark:0xa89a88, barkMap:()=>tex.palmBark, wind:0.012, flutter:0.07,
  leaves:()=>ATLAS.cocoFrond ??= frondTexture(32, { hue:0.24, sat:0.55, light:0.36, gap:8, ang:0.35, lw:5, sag:6 }),
  build:()=>genPalm({ h:15, r:0.22, base:0.6, lean:0.32, n:24, frond:5.4, fw:1.15, elLow:-0.5, elHigh:0.9, droop:0.55, fold:0.35 }, 808) });
defineSpecies('acai', { seed:909, baseH:14, bark:0x8f8a78, barkMap:()=>tex.palmBark, wind:0.014, flutter:0.08,
  leaves:()=>ATLAS.acaiFrond ??= frondTexture(33, { hue:0.27, sat:0.5, light:0.26, gap:6, ang:0.18, lw:3.2, sag:14 }),
  build:()=>genPalm({ h:14, r:0.1, base:0.4, lean:0.12, n:14, frond:3.8, fw:1.05, elLow:-0.2, elHigh:1.0, droop:0.75, fold:0.15 }, 909) });
const palmSet = kind => ({ kind, F:forest(), baseH:SPECIES_DEF[kind].baseH });
flora.pushPalm = (set, x, y, z, h, r, tint) => set.F.add(set.kind, x, y-0.2, z, h/set.baseH, r()*TAU, tint);
flora.palms = set => set.F.build();
tex.fern = (() => {
  const c=document.createElement('canvas'); c.width=128; c.height=512; const g=c.getContext('2d'); const r=rng(19);
  g.lineCap='round';
  for (let y=500;y>10;y-=5){ const t=1-y/512; const len=6+44*Math.sin(Math.PI*Math.min(1,t*1.05)); for (const s of [-1,1]){ g.strokeStyle=`hsl(${95+r()*20},${50+r()*20}%,${24+r()*14}%)`; g.lineWidth=2.6+r(); g.beginPath(); g.moveTo(64,y); g.quadraticCurveTo(64+s*len*0.5,y-3,64+s*len,y-8-r()*4); g.stroke(); } }
  g.strokeStyle='#4d5a2a'; g.lineWidth=3; g.beginPath(); g.moveTo(64,512); g.lineTo(64,6); g.stroke();
  return finishTex(new THREE.CanvasTexture(c));
})();
flora.fernMat = function(){ const k=this._key('fernMat'); return this._cache[k] ??= keep(addWind(new THREE.MeshStandardMaterial({ map:tex.fern, color:0x8a9a6c, alphaTest:0.45, side:THREE.DoubleSide, roughness:0.75 }), 0.03)); };

/* ---------- Biome registry ---------- */
const BIOMES = [];
const Helios = { registerBiome(def){ BIOMES.push(def); return def; }, kit, scene, camera, renderer };
window.Helios = Helios;

/* ============================== AMAZON ============================== */
Helios.registerBiome({
  id:'amazon', label:'Amazon',
  sky:{ turbidity:5.5, rayleigh:2.0, mie:0.006, mieG:0.85 },
  fog:{ density:0.0019, tint:[0.94,1.0,0.9] },
  ground:[0.16,0.2,0.08],
  camera(){ const rx=z=>38*Math.sin(z*0.0055)+22*Math.sin(z*0.0155+1.3); return { pos:[rx(140),7.5,140], look:[rx(-160),9,-160] }; },
  build(k){
    const { noise:{fbm,perlin}, rng, smoothstep, lerp, srgb, flora } = k;
    const rx = z => 38*Math.sin(z*0.0055) + 22*Math.sin(z*0.0155+1.3);
    const rw = z => 30 + 6*Math.sin(z*0.011+0.7);
    const heightAt = (x,z) => {
      const d=Math.abs(x-rx(z)), w=rw(z);
      const bed = -3.4*(1-Math.min(1,(d/w)**2));
      const hills = Math.max(0, fbm(x*0.0032+5, z*0.0032, 4))*44 * smoothstep(w*1.5, w*6, d);
      const ground = 1.4 + hills + fbm(x*0.03, z*0.03, 3)*1.0;
      return lerp(bed, ground, smoothstep(w*0.78, w*1.25, d));
    };
    const group = new THREE.Group();
    group.add(makeTerrain({ size:1800, cz:-250, seg:360, height:heightAt, color:(c,x,y,z,ny)=>{
      if (y < 0.4) return srgb(c, 0.14,0.10,0.06);
      if (y < 2.6) { const t=smoothstep(0.4,2.6,y); return srgb(c, lerp(0.30,0.14,t), lerp(0.22,0.17,t), lerp(0.13,0.07,t)); }
      const n=0.5+0.5*perlin(x*0.05,z*0.05), m=0.5+0.5*perlin(x*0.21,z*0.21); return srgb(c, 0.26+0.08*n+0.04*m, 0.22+0.06*n+0.05*m, 0.12+0.03*n);
    }}));
    group.add(makeWater({ size:1800, cz:-250, color:0x1c1408, distortion:1.4, scale:5 }));

    // Forest: closed canopy of procedural broadleaf trees with kapok emergents; riverbank belt of
    // cecropia, shrubs, açaí palms and ferns; lianas curtaining the banks.
    const R = rng(21), c = new THREE.Color(), F = k.forest(), palms=palmSet('acai'), vines=[], ferns=[];
    const tint = (y=0) => new THREE.Color(0.86+R()*0.28 + y, 0.9+R()*0.2 + y*0.6, 0.78+R()*0.3);
    const step = 13.5;
    for (let gx=-900; gx<900; gx+=step) for (let gz=-1150; gz<650; gz+=step){
      const x=gx+(R()-0.5)*step*0.95, z=gz+(R()-0.5)*step*0.95, d=Math.abs(x-rx(z)), w=rw(z);
      if (d < w*1.45) continue;
      const g=heightAt(x,z), p=R();
      if (p < 0.045) F.add('kapok', x, g-0.4, z, 0.85+R()*0.3, R()*TAU, tint(0.08));
      else if (p < 0.55) F.add('canopyA', x, g-0.3, z, 0.8+R()*0.45, R()*TAU, tint(R()<0.1?0.15:0));
      else F.add('canopyB', x, g-0.3, z, 0.8+R()*0.45, R()*TAU, tint(R()<0.1?0.12:0));
      if (R() < 0.55) F.add('shrub', x+(R()-0.5)*step, g-0.2, z+(R()-0.5)*step, 0.9+R()*0.7, R()*TAU, tint());
      if (R() < 0.18) flora.pushPalm(palms, x+(R()-0.5)*step, g, z+(R()-0.5)*step, 8+R()*9, R, tint());
      for (let q=0; q<2; q++) if (R() < 0.7) ferns.push({ p:new THREE.Vector3(x+(R()-0.5)*step, g-0.1, z+(R()-0.5)*step), s:new THREE.Vector3(1,1,1).multiplyScalar(0.4+R()*0.45), ry:R()*TAU, c:c.setRGB(0.8+R()*0.3, 0.95+R()*0.15, 0.7+R()*0.2).clone() });
    }
    const nBank = Math.round(2600*Q.density);
    for (let i=0;i<nBank;i++){
      const z=-250+(R()*2-1)*890, w=rw(z), side=R()<0.5?-1:1, d=w*(0.98+R()*0.5), x=rx(z)+side*d, g=Math.max(heightAt(x,z),-0.2);
      const p=R();
      if (p < 0.38) F.add('shrub', x, g-0.2, z, 0.8+R()*0.6, R()*TAU, tint());
      else if (p < 0.52) F.add('cecropia', x, g-0.2, z, 0.8+R()*0.4, R()*TAU, tint());
      else if (p < 0.72){ for (let s2=0; s2<3+((R()*3)|0); s2++) flora.pushPalm(palms, x+(R()-0.5)*3, g, z+(R()-0.5)*3, 9+R()*8, R, tint()); }
      else ferns.push({ p:new THREE.Vector3(x, g-0.1, z), s:new THREE.Vector3(1,1,1).multiplyScalar(0.45+R()*0.4), ry:R()*TAU, c:c.setRGB(0.8+R()*0.3, 0.95+R()*0.15, 0.7+R()*0.2).clone() });
      if (R() < 0.1 && Math.abs(z-60) < 700) vines.push({ p:new THREE.Vector3(rx(z)+side*w*(1.0+R()*0.1), g+7+R()*10, z), s:new THREE.Vector3(2.5+R()*3, 7+R()*8, 1), ry:(side<0?Math.PI/2:-Math.PI/2)+(R()-0.5)*0.6, c:c.setHSL(0.24,0.4,0.22+R()*0.1,THREE.SRGBColorSpace).clone() });
    }
    group.add(F.build());
    group.add(flora.palms(palms));
    { const fg = instTiled(flora.palmHead(), flora.fernMat(), ferns, { tile:50, shadow:false }); fg.children.forEach(m => m.userData.lodTile = true); group.add(fg); }
    // Hanging lianas curtaining the banks
    const vineTex = (() => { const cv=document.createElement('canvas'); cv.width=128; cv.height=512; const g=cv.getContext('2d'); const vr=rng(8);
      for (let i=0;i<22;i++){ let x=8+vr()*112, y=0; const len=180+vr()*330; g.strokeStyle=`hsl(${70+vr()*30},${30+vr()*20}%,${22+vr()*16}%)`; g.lineWidth=1.5+vr()*2; g.beginPath(); g.moveTo(x,0);
        while (y<len){ y+=10; x+=(vr()-0.5)*4; g.lineTo(x,y); } g.stroke();
        for (let yy=10; yy<len; yy+=8+vr()*10){ g.fillStyle=`hsl(${85+vr()*25},${35+vr()*25}%,${24+vr()*20}%)`; g.beginPath(); g.ellipse(x+(vr()-0.5)*8, yy, 3+vr()*4, 1.5+vr()*2, vr()*3, 0, TAU); g.fill(); } }
      return finishTex(new THREE.CanvasTexture(cv)); })();
    vineTex.userData = {};
    const vineGeo = new THREE.PlaneGeometry(1,1).translate(0,-0.5,0);
    const vineMat = new THREE.MeshStandardMaterial({ map:vineTex, alphaTest:0.4, alphaToCoverage:true, side:THREE.DoubleSide, roughness:0.8 });
    group.add(instTiled(vineGeo, vineMat, vines, { shadow:false }));

    // Humid mist sheets drifting over the canopy
    const mist = [];
    for (const y of [9, 17, 30]){
      const mt = tex.cloud.clone(); mt.userData = {}; mt.repeat.set(5,5); mt.needsUpdate = true;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(1800,1800), new THREE.MeshBasicMaterial({ map:mt, transparent:true, opacity:y<20?0.09:0.06, depthWrite:false }));
      m.rotation.x=-Math.PI/2; m.position.set(0,y,-250); group.add(m); mist.push(m);
    }
    // Fireflies along the banks at night
    const ff = (() => { const n=900, pos=new Float32Array(n*3); for (let i=0;i<n;i++){ const z=-250+(R()*2-1)*500, w=rw(z), x=rx(z)+(R()<0.5?-1:1)*w*(0.95+R()*0.5); pos[i*3]=x; pos[i*3+1]=heightAt(x,z)+0.8+R()*5; pos[i*3+2]=z; }
      const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      return new THREE.Points(g, new THREE.PointsMaterial({ map:tex.glow, color:0xc8ff7a, size:0.9, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending })); })();
    group.add(ff);
    return { group, heightAt, update(dt, env){
      mist.forEach((m,i) => { m.material.map.offset.x += dt*0.0015*(i+1); m.material.color.copy(scene.fog.color); });
      ff.material.opacity = env.night * (0.6 + 0.4*Math.sin(env.time*3.1));
    }};
  }
});

/* ============================== SEA ============================== */
Helios.registerBiome({
  id:'sea', label:'Sea',
  sky:{ turbidity:3.5, rayleigh:1.6, mie:0.004, mieG:0.8 },
  fog:{ density:0.00042, tint:[0.9,0.96,1.05] },
  ground:[0.1,0.25,0.3],
  camera:{ pos:[40,3.2,-140], look:[-180,18,-700] },
  build(k){
    const { noise:{fbm,ridged,perlin}, rng, smoothstep, lerp, srgb, flora } = k;
    const isl = [ {x:-260,z:-720,r:250,h:130}, {x:430,z:-1250,r:340,h:190}, {x:-950,z:-1650,r:430,h:95}, {x:170,z:-430,r:70,h:12}, {x:-560,z:-360,r:110,h:40} ];
    const heightAt = (x,z) => {
      let h = -24 + fbm(x*0.002, z*0.002, 4)*8;
      for (const I of isl){
        const d = Math.hypot(x-I.x, z-I.z)/I.r; if (d > 1.8) continue;
        const shelf = -24 + 26.5*smoothstep(1.8, 0.96, d);
        const peak = I.h*Math.pow(Math.max(0,1-d),1.45)*(0.65+0.7*ridged(x*0.006+I.x*0.01, z*0.006, 4));
        h = Math.max(h, shelf + peak);
      }
      return h;
    };
    const group = new THREE.Group();
    group.add(makeTerrain({ size:4200, cz:-800, seg:420, height:heightAt, color:(c,x,y,z,ny)=>{
      if (y < -0.6){ const t=smoothstep(-0.6,-20,y); return srgb(c, lerp(0.86,0.12,t), lerp(0.80,0.26,t), lerp(0.62,0.28,t)); }
      if (y < 3.4) return srgb(c, 0.88,0.80,0.63);
      if (ny < 0.72) { const n=0.5+0.5*perlin(x*0.04,y*0.08); return srgb(c, 0.30+0.08*n,0.27+0.06*n,0.24+0.05*n); }
      const n=0.5+0.5*perlin(x*0.03,z*0.03); return srgb(c, 0.10+0.05*n,0.20+0.07*n,0.06);
    }}));
    group.add(makeWater({ size:12000, cz:-800, color:0x00394d, distortion:3.6, scale:1.6, alpha:0.86 }));

    const R=rng(31), c=new THREE.Color(), palms=palmSet('coconut'), rocks=[], F=k.forest();
    for (const I of isl){
      const nJ = Math.round(I.r*I.r/110), nP = Math.round(I.r*3.2*Q.density);
      for (let i=0;i<nJ;i++){ const a=R()*TAU, d=Math.sqrt(R())*I.r*0.95, x=I.x+Math.cos(a)*d, z=I.z+Math.sin(a)*d, h=heightAt(x,z); if (h<6 || h>I.h*0.75) continue; F.add(R()<0.8?'island':'canopyB', x, h-0.4, z, 0.7+R()*0.5, R()*TAU, new THREE.Color(0.85+R()*0.3, 0.9+R()*0.2, 0.8+R()*0.3)); }
      for (let i=0;i<nP;i++){ const a=R()*TAU, d=I.r*(0.88+R()*0.22), x=I.x+Math.cos(a)*d, z=I.z+Math.sin(a)*d, h=heightAt(x,z); if (h<2.4 || h>9) continue; flora.pushPalm(palms, x, h, z, 8+R()*8, R, new THREE.Color(0.9+R()*0.2,0.95+R()*0.1,0.85+R()*0.2)); }
      for (let i=0;i<Math.round(I.r*0.7);i++){ const a=R()*TAU, d=I.r*(0.95+R()*0.35), x=I.x+Math.cos(a)*d, z=I.z+Math.sin(a)*d, h=heightAt(x,z); if (h>2 || h<-8) continue; const s=1.5+R()*R()*9; rocks.push({ p:new THREE.Vector3(x,h-s*0.2,z), s:new THREE.Vector3(s,s*(0.6+R()*0.9),s*(0.7+R()*0.5)), ry:R()*TAU, c:new THREE.Color().setScalar(0.8+R()*0.25) }); }
    }
    for (let i=0;i<6;i++){ const s=12+R()*20; rocks.push({ p:new THREE.Vector3(-80+R()*260,-4,-420-R()*200), s:new THREE.Vector3(s*0.5,s*1.6,s*0.5), ry:R()*TAU, c:new THREE.Color().setScalar(0.85) }); }  // sea stacks
    group.add(F.build());
    group.add(flora.palms(palms));
    group.add(instTiled(flora.rock(), flora.rockMat(), rocks));
    const boats = [0,1,2].map(i => { const b=flora.boat(0xffffff, 0xe8e2d8); b.scale.setScalar(1.3); b.position.set(-120+i*170, 0, -320-i*260); b.rotation.y=0.6+i; group.add(b); return b; });
    return { group, heightAt, update(dt, env){
      boats.forEach((b,i) => { b.translateZ(dt*(2.5+i)); b.position.y = 0.25*Math.sin(env.time*1.3+i); b.rotation.z = 0.06*Math.sin(env.time*0.9+i*2); b.rotation.x = 0.04*Math.sin(env.time*1.1+i); });
    }};
  }
});

/* ============================== EGYPT ============================== */
Helios.registerBiome({
  id:'egypt', label:'Egypt',
  sky:{ turbidity:10, rayleigh:1.3, mie:0.006, mieG:0.86 },
  fog:{ density:0.00062, tint:[1.08,0.96,0.82] },
  ground:[0.4,0.32,0.2],
  camera(){ const cx=z=>-80+0.12*z+35*Math.sin(z*0.0035), w=z=>60+8*Math.sin(z*0.01); return { pos:[cx(-60)+w(-60)+55,24,-60], look:[cx(-300)-(w(-300)+60),14,-300] }; },
  build(k){
    const { noise:{fbm,ridged,perlin,hash2}, rng, smoothstep, lerp, srgb, flora } = k;
    const cx = z => -80 + 0.12*z + 35*Math.sin(z*0.0035);
    const nw = z => 60 + 8*Math.sin(z*0.01);
    const heightAt = (x,z) => {
      const d=x-cx(z), ad=Math.abs(d), w=nw(z);
      const bed = -4.2*(1-Math.min(1,(ad/w)**2));
      let g = 1.4 + perlin(x*0.01,z*0.01)*0.4;
      if (d < 0){ g += 22*smoothstep(-210,-330,d) + 3*fbm(x*0.004,z*0.004,3)*smoothstep(-260,-400,d) + 38*ridged(x*0.0022,z*0.0035,4)*smoothstep(-880,-1200,d); }
      else { g += 9*smoothstep(480,820,d) + 18*ridged(x*0.0028+3,z*0.004,4)*smoothstep(720,1050,d); }
      return lerp(bed, g, smoothstep(w*0.8, w*1.2, ad));
    };
    const group = new THREE.Group();
    group.add(makeTerrain({ size:3400, cz:-500, seg:480, height:heightAt, color:(c,x,y,z,ny)=>{
      const d=x-cx(z), ad=Math.abs(d), w=nw(z);
      if (y < 0.6) return srgb(c, 0.24,0.20,0.14);
      const field = (d<0 ? (ad>w && ad<205) : (ad>w && d<470)) && y < 4;
      if (field){
        if (ad < w+12) return srgb(c, 0.30,0.25,0.17);
        const px=Math.floor((x+5000)/28), pz=Math.floor((z+5000)/42), r=hash2(px,pz);
        const fx=((x+5000)/28)%1, fz=((z+5000)/42)%1;
        if (fx<0.08 || fz<0.06) return srgb(c, 0.20,0.24,0.14);
        if (r < 0.62) return srgb(c, 0.20+r*0.12, 0.34+r*0.1, 0.09);
        if (r < 0.82) return srgb(c, 0.62,0.55,0.26);
        return srgb(c, 0.40,0.31,0.19);
      }
      const n=0.5+0.5*perlin(x*0.02,z*0.02);
      if (d < -200 && d > -880) return srgb(c, 0.74+0.06*n, 0.62+0.05*n, 0.46+0.04*n);
      return srgb(c, 0.84+0.05*n, 0.67+0.05*n, 0.45+0.04*n);
    }}));
    group.add(makeWater({ size:3400, cz:-500, color:0x0e4a4a, distortion:1.8, scale:4 }));

    const stoneMat = new THREE.MeshStandardMaterial({ vertexColors:true, map:tex.ground, roughness:0.88 });
    const sandstone = new THREE.MeshStandardMaterial({ color:0xd6b98a, map:tex.ground, roughness:0.85 });
    const gold = new THREE.MeshStandardMaterial({ color:0xe8c46a, metalness:0.95, roughness:0.28 });
    // Stepped pyramid: one box per masonry course, smooth casing near the apex
    function pyramid(base, height, courses, casing){
      const parts=[], R=rng(Math.round(base)); const ch=height/courses;
      for (let i=0;i<courses;i++){
        const t=i/courses, s=base*(1-t)+0.6;
        const g=new THREE.BoxGeometry(s, ch*1.02, s); g.translate(0, ch*(i+0.5), 0);
        const cased = t > 1-casing, v = cased ? 0.92 : 0.78+R()*0.08;
        const col=new Float32Array(g.attributes.position.count*3), cc=new THREE.Color();
        srgb(cc, v*(cased?1.0:0.95), v*(cased?0.9:0.8), v*(cased?0.75:0.62));
        for (let j=0;j<col.length;j+=3){ col[j]=cc.r; col[j+1]=cc.g; col[j+2]=cc.b; }
        g.setAttribute('color', new THREE.BufferAttribute(col,3)); parts.push(g);
      }
      const m=new THREE.Mesh(mergeGeometries(parts), stoneMat); parts.forEach(p=>p.dispose()); m.castShadow=m.receiveShadow=true; return m;
    }
    const pyr = [ [-470,-700,140,90,60,0.18], [-560,-900,132,86,58,0.12], [-610,-1080,64,42,34,0], [-400,-640,22,14,12,0], [-395,-670,22,14,12,0], [-390,-700,22,14,12,0] ];
    for (const [dx,z,b,h,c,cs] of pyr){ const x=cx(z)+dx; const p=pyramid(b,h,c,cs); p.position.set(x, heightAt(x,z)-1.2, z); p.rotation.y=0.03; group.add(p); }

    // Temple on the west bank: quay, battered pylons, hypostyle colonnade, sanctuary, obelisks, ram avenue
    const zT=-300, temple=new THREE.Group(); temple.position.set(cx(zT)-(nw(zT)+58), 0, zT); group.add(temple);
    const add = (geo, mat, x,y,z) => { const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; temple.add(m); return m; };
    const batter = (w,h,d,k) => { const g=new THREE.BoxGeometry(w,h,d,1,1,1); const p=g.attributes.position; for(let i=0;i<p.count;i++) if(p.getY(i)>0){ p.setX(i,p.getX(i)*k); p.setZ(i,p.getZ(i)*(0.5+k*0.5)); } g.computeVertexNormals(); return g; };
    add(new THREE.BoxGeometry(118,3.4,124), sandstone, -3,1.7,0);
    for (const s of [-1,1]) add(batter(13,26,30,0.72), sandstone, 26,3.4+13,s*19);
    add(new THREE.BoxGeometry(9,4,10), sandstone, 26,3.4+18.5,0);
    const colG = (() => { const shaft=new THREE.CylinderGeometry(1.25,1.45,13,18).translate(0,6.5,0); const cap=new THREE.CylinderGeometry(2.1,1.25,2.4,18).translate(0,14.2,0); const base=new THREE.CylinderGeometry(1.7,1.8,0.8,18).translate(0,0.4,0); return mergeGeometries([shaft,cap,base]); })();
    const cols=[]; for (let i=0;i<12;i++) for (const s of [-1,1]) for (const r of [10,16]) cols.push({ p:new THREE.Vector3(14-i*5.4,3.4,s*r), s:new THREE.Vector3(1,1,1), ry:0 });
    temple.add(instTiled(colG, sandstone, cols, { tile:1000 }));
    for (const s of [-1,1]) for (const r of [10,16]) add(new THREE.BoxGeometry(66,1.6,2.6), sandstone, -15.7,3.4+16.2,s*r);
    add(new THREE.BoxGeometry(22,16,40), sandstone, -58,3.4+8,0);
    for (const s of [-1,1]) add(new THREE.BoxGeometry(54,6,1.6), sandstone, -15,3.4+3,s*24);
    const granite = new THREE.MeshStandardMaterial({ color:0xb7614a, roughness:0.6 });
    for (const s of [-1,1]){ add(batter(2.6,26,2.6,0.62), granite, 38,3.4+13,s*9); const tip=new THREE.Mesh(new THREE.ConeGeometry(1.15,2.6,4).rotateY(Math.PI/4), gold); tip.position.set(38,3.4+27.3,s*9); tip.castShadow=true; temple.add(tip); }
    const rams=[]; for (let i=0;i<8;i++) for (const s of [-1,1]) rams.push({ p:new THREE.Vector3(60+i*5.5,1.4,s*7), s:new THREE.Vector3(3.6,2.2,1.6), ry:0 });
    temple.add(instTiled(new THREE.BoxGeometry(1,1,1).translate(0,0.5,0), sandstone, rams, { tile:1000 }));
    const torches=[]; for (const [x,z] of [[33,-5],[33,5],[50,-7],[50,7],[60,-7],[60,7]]){ const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex.glow, color:0xffa040, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity:0 })); s.position.set(x,6.5,z); s.scale.setScalar(5); temple.add(s); torches.push(s); }

    // Palms along both banks + groves in the fields, mud-brick village on the east bank
    const R=rng(55), palms=palmSet('datePalm'), houses=[];
    for (let i=0;i<Math.round(2400*Q.density);i++){
      const z=-500+(R()*2-1)*1500, w=nw(z), side=R()<0.5?-1:1;
      const d = R()<0.7 ? w+6+R()*70 : w+20+R()*(side<0?160:420);
      const x=cx(z)+side*d; if (Math.abs(z-zT)<75 && side<0 && d<w+120) continue;
      const h=heightAt(x,z); if (h>4.5) continue;
      flora.pushPalm(palms, x, h, z, 10+R()*9, R, new THREE.Color(0.9+R()*0.2, 0.92+R()*0.15, 0.85+R()*0.2));
    }
    group.add(flora.palms(palms));
    for (let i=0;i<Math.round(900*Q.density);i++){
      const z=-180-R()*520, x=cx(z)+nw(z)+95+R()*230; if (perlin(x*0.012,z*0.012) < 0.05) continue;
      const sx=6+R()*9, sz=6+R()*9, sy=3+R()*R()*6, l=0.42+R()*0.14;
      houses.push({ p:new THREE.Vector3(Math.round(x/4)*4, heightAt(x,z)-0.2, Math.round(z/4)*4), s:new THREE.Vector3(sx,sy,sz), ry:(R()<0.5?0:Math.PI/2)+(R()-0.5)*0.08, c:srgb(new THREE.Color(), l*1.25, l, l*0.72) });
    }
    group.add(instTiled(new THREE.BoxGeometry(1,1,1).translate(0,0.5,0), new THREE.MeshStandardMaterial({ map:tex.ground, roughness:0.95 }), houses));

    const boats=[]; for (let i=0;i<9;i++){ const b=flora.boat(); b.userData={ z:-1300+R()*1500, lane:(R()-0.5)*1.1, sp:(R()<0.5?-1:1)*(2.2+R()*2.5) }; group.add(b); boats.push(b); }
    return { group, heightAt, update(dt, env){
      for (const b of boats){ const u=b.userData; u.z += u.sp*dt; if (u.z>350) u.z=-1500; if (u.z<-1500) u.z=350;
        const z=u.z, x=cx(z)+u.lane*nw(z)*0.6, dx=0.12+35*0.0035*Math.cos(z*0.0035), sg=Math.sign(u.sp);
        b.position.set(x, 0.1*Math.sin(env.time+u.lane*9), z); b.rotation.y = Math.atan2(dx*sg, sg); b.rotation.z = 0.03*Math.sin(env.time*0.8+u.lane*5); }
      torches.forEach((t,i) => t.material.opacity = env.night*(0.75+0.25*Math.sin(env.time*11+i*1.7)));
    }};
  }
});

/* ============================== ENGINE STATE ============================== */
const TOD = { dawn:[-0.9,0.07], noon:[0.25,1.05], dusk:[0.1,0.09], night:[-0.5,-0.3] };
const WX = { clear:[1,0], rain:[2.0,1], fog:[4.8,0] };
const S = { yaw:0, pitch:0, tYaw:0, tPitch:0, pos:new THREE.Vector3(), tPos:new THREE.Vector3(),
  sun:[...TOD.dusk], tSun:[...TOD.dusk], wx:[1,0], tWx:[1,0], keys:{}, stick:[0,0], time:0, flash:0, nextFlash:4 };
let active = null, activeDef = null, envDirty = true, envTimer = 0;

function disposeTree(o){
  o.traverse(n => {
    if (n.geometry && !n.geometry.userData.keep) n.geometry.dispose();
    const ms = Array.isArray(n.material) ? n.material : (n.material ? [n.material] : []);
    for (const m of ms){ if (m.userData.keep) continue; if (m.map && !m.map.userData.keep) m.map.dispose(); m.dispose(); }
  });
}
function lookFrom(pos, look){
  const d = new THREE.Vector3(...look).sub(new THREE.Vector3(...pos)).normalize();
  return { yaw: Math.atan2(d.x, -d.z), pitch: Math.asin(d.y) };
}
function setCameraPreset(def, snap){
  const c = typeof def.camera === 'function' ? def.camera(kit) : def.camera;
  const { yaw, pitch } = lookFrom(c.pos, c.look);
  S.tPos.set(...c.pos); S.tYaw = yaw; S.tPitch = pitch;
  if (snap){ S.pos.copy(S.tPos); S.yaw=yaw; S.pitch=pitch; }
}
const veil = document.getElementById('veil');
function loadBiome(id){
  const def = BIOMES.find(b => b.id === id) || BIOMES[0];
  document.getElementById('veilTitle').textContent = def.label;
  document.getElementById('veilMsg').textContent = 'Growing the world…';
  veil.classList.remove('gone');
  const run = () => {
    if (active){ scene.remove(active.group); disposeTree(active.group); }
    waters.length = 0;
    activeDef = def; active = def.build(kit); scene.add(active.group);
    lodTiles.length = 0; active.group.traverse(o => { if (o.userData.lodTile) lodTiles.push(o); }); VU.uLod.value = Q.lod;
    document.getElementById('bname').textContent = def.label;
    setCameraPreset(def, true); envDirty = true;
    veil.classList.add('gone');
  };
  if (window.__HEADLESS) run(); else requestAnimationFrame(() => requestAnimationFrame(run));
}
/* Headless verification hooks (used only by the local render harness) */
window.__helios = { load: id => loadBiome(id), S, setQuality: k => { qKey=k; Q=QUALITY[k]; applyQuality(); },
  snap(steps=3){ for (let i=0;i<steps;i++){ last -= 1000/30; frame(last + 1000/30, true); } return canvas.toDataURL('image/jpeg', 0.92); },
  stats(){ return renderer.info.render; } };

/* ============================== ATMOSPHERE ============================== */
const _sunDir = new THREE.Vector3(), _moonDir = new THREE.Vector3(), _c = new THREE.Color(), _c2 = new THREE.Color();
const FOG_DAY = new THREE.Color().setRGB(0.66,0.75,0.85,THREE.SRGBColorSpace), FOG_GOLD = new THREE.Color().setRGB(0.86,0.64,0.44,THREE.SRGBColorSpace), FOG_NIGHT = new THREE.Color().setRGB(0.035,0.05,0.085,THREE.SRGBColorSpace), FOG_RAIN = new THREE.Color().setRGB(0.42,0.46,0.5,THREE.SRGBColorSpace);
function updateAtmosphere(dt){
  const [az, el] = S.sun, rainK = S.wx[1], fogK = S.wx[0];
  _sunDir.set(Math.sin(az)*Math.cos(el), Math.sin(el), -Math.cos(az)*Math.cos(el)).normalize();
  const day = smoothstep(-0.06, 0.18, el), golden = 1 - smoothstep(0.08, 0.5, el), night = 1 - smoothstep(-0.12, 0.02, el);

  const u = sky.material.uniforms, sp = activeDef.sky;
  u.turbidity.value = lerp(sp.turbidity, 18, rainK); u.rayleigh.value = lerp(sp.rayleigh, 0.6, rainK);
  u.mieCoefficient.value = lerp(sp.mie, 0.02, rainK); u.mieDirectionalG.value = sp.mieG;
  u.sunPosition.value.copy(_sunDir);

  // Light: sun by day, moon by night
  _moonDir.set(-_sunDir.x, Math.max(0.35, -_sunDir.y), -_sunDir.z).normalize();
  const useSun = el > -0.03, dir = useSun ? _sunDir : _moonDir;
  if (useSun) _c.setRGB(1.0, 0.95, 0.88).lerp(_c2.setRGB(1.0, 0.55, 0.25), golden*0.85); else _c.setRGB(0.55, 0.65, 1.0);
  sun.color.copy(_c);
  sun.intensity = (useSun ? 3.0*smoothstep(-0.03, 0.12, el) : 0.35*night) * (1 - rainK*0.7);
  hemi.color.setRGB(0.7,0.8,1.0); hemi.groundColor.setRGB(...activeDef.ground);
  hemi.intensity = lerp(0.35, 1.9, day) * (1 - rainK*0.3) * (1 + S.flash*4);
  VU.uSunDir.value.copy(dir); VU.uSunCol.value.copy(sun.color).multiplyScalar(sun.intensity);
  VU.uHemiSky.value.copy(hemi.color).multiplyScalar(hemi.intensity); VU.uHemiGround.value.copy(hemi.groundColor).multiplyScalar(hemi.intensity);

  // Shadow camera follows the viewer, snapped to texels to stop shimmer
  const texel = (2*Q.ext)/Q.shadow;
  const tx = Math.round(S.pos.x/texel)*texel, tz = Math.round(S.pos.z/texel)*texel;
  sun.target.position.set(tx, S.pos.y*0.5, tz);
  sun.position.set(tx + dir.x*600, S.pos.y*0.5 + dir.y*600, tz + dir.z*600);

  // Fog
  _c.copy(FOG_DAY).lerp(FOG_GOLD, golden*day).lerp(FOG_NIGHT, night);
  const t = activeDef.fog.tint; _c.r*=t[0]; _c.g*=t[1]; _c.b*=t[2];
  _c.lerp(_c2.copy(FOG_RAIN).multiplyScalar(0.25+0.75*day), rainK*0.8);
  scene.fog.color.copy(_c); scene.fog.density = activeDef.fog.density * fogK;
  renderer.toneMappingExposure = lerp(0.8, 0.72, day) * (1 - rainK*0.1);

  // Clouds, stars, moon, rain
  _c.setRGB(1,1,1).lerp(_c2.setRGB(1.0,0.66,0.45), golden*day).multiplyScalar(lerp(0.08,1,day)).lerp(_c2.setRGB(0.35,0.37,0.4), rainK*0.8);
  clouds.children.forEach(s => { s.material.color.copy(_c); s.material.opacity = lerp(0.7, 0.95, rainK); s.position.x += s.userData.drift*dt; if (s.position.x > 6000) s.position.x = -6000; });
  clouds.position.set(S.pos.x, 0, S.pos.z);
  stars.material.opacity = night * (1 - rainK) * (1 - Math.min(1, (fogK-1)/3)); stars.position.copy(S.pos);
  moon.position.copy(S.pos).addScaledVector(_moonDir, 8000); moon.material.opacity = night*(1-rainK)*0.9;
  rain.material.opacity = rainK * 0.55; rain.visible = rainK > 0.02;
  if (rain.visible){
    const p = rain.geometry.attributes.position.array, sd = rain.userData.seeds, n = sd.length/3, fall = S.time*28;
    for (let i=0;i<n;i++){ const y = 60 - ((sd[i*3+1] + fall) % 60); const x=S.pos.x+sd[i*3], z=S.pos.z+sd[i*3+2], yy=S.pos.y-20+y; p[i*6]=x; p[i*6+1]=yy; p[i*6+2]=z; p[i*6+3]=x+0.15; p[i*6+4]=yy-1.4; p[i*6+5]=z; }
    rain.geometry.attributes.position.needsUpdate = true;
    if (rainK > 0.5 && (S.nextFlash -= dt) < 0){ S.flash = 1; S.nextFlash = 4 + Math.random()*9; }
  }
  S.flash = Math.max(0, S.flash - dt*5);
  WIND.value.set(S.time, 1 + rainK*2.5);

  for (const w of waters){ if (w.userData.cheap){ w.material.normalMap.offset.x += dt*0.004; w.material.normalMap.offset.y += dt*0.0025; continue; } const wu = w.material.uniforms; wu.time.value += dt*0.6; wu.sunDirection.value.copy(dir); wu.sunColor.value.copy(sun.color).multiplyScalar(useSun ? smoothstep(-0.03,0.1,el)*(1-rainK*0.8) : 0.25*night); }

  envTimer -= dt;
  if (envDirty && envTimer <= 0){ if (envRT) envRT.dispose(); envRT = pmrem.fromScene(envScene, 0, 0.1, 100); scene.environment = envRT.texture; envDirty = false; envTimer = 0.25; }
  return { night, day, time:S.time };
}

/* ============================== HUD ============================== */
function hudGroup(id, entries, current, on){
  const g = document.getElementById(id);
  entries.forEach(([key,label]) => { const b=document.createElement('button'); b.textContent=label; b.dataset.k=key; b.setAttribute('aria-pressed', key===current);
    b.onclick=()=>{ on(key); g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); }; g.appendChild(b); });
}
const cap = s => s[0].toUpperCase()+s.slice(1);
const startId = BIOMES.some(b=>b.id===location.hash.slice(1)) ? location.hash.slice(1) : BIOMES[0].id;
hudGroup('g-biome', BIOMES.map(b=>[b.id,b.label]), startId, id => loadBiome(id));
hudGroup('g-tod', Object.keys(TOD).map(k=>[k,cap(k)]), 'dusk', k => S.tSun=[...TOD[k]]);
hudGroup('g-wx', Object.keys(WX).map(k=>[k,cap(k)]), 'clear', k => S.tWx=[...WX[k]]);
hudGroup('g-q', Object.keys(QUALITY).map(k=>[k,QUALITY[k].label]), qKey, k => { qKey=k; Q=QUALITY[k]; dynScale=1; applyQuality(); loadBiome(activeDef.id); });
const hud=document.getElementById('hud'), show=document.getElementById('show');
function toggleHud(){ const off=!hud.classList.toggle('off'); show.hidden=off; }
document.getElementById('hide').onclick=toggleHud; show.onclick=toggleHud;

/* ============================== INPUT ============================== */
addEventListener('keydown', e => { S.keys[e.code]=true; if (e.code==='KeyH') toggleHud();
  const n=+e.key; if (n>=1 && n<=BIOMES.length) document.querySelector(`#g-biome [data-k="${BIOMES[n-1].id}"]`).click(); });
addEventListener('keyup', e => S.keys[e.code]=false);
addEventListener('blur', () => S.keys={});
let drag=null;
canvas.addEventListener('pointerdown', e => { drag={x:e.clientX,y:e.clientY,id:e.pointerId}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => drag=null);
canvas.addEventListener('pointermove', e => {
  const locked = document.pointerLockElement===canvas;
  if (!locked && (!drag || drag.id!==e.pointerId)) return;
  const dx = locked ? e.movementX : e.clientX-drag.x, dy = locked ? e.movementY : e.clientY-drag.y;
  const k = e.pointerType==='touch' ? 0.005 : 0.0032;
  S.tYaw += dx*k; S.tPitch = clamp(S.tPitch - dy*k, -1.4, 1.4);
  if (drag){ drag.x=e.clientX; drag.y=e.clientY; }
});
canvas.addEventListener('dblclick', () => { try { document.pointerLockElement ? document.exitPointerLock() : canvas.requestPointerLock(); } catch(_){} });
const stick=document.getElementById('stick'), knob=document.getElementById('knob');
stick.addEventListener('pointerdown', e => { stick.setPointerCapture(e.pointerId); moveStick(e); });
stick.addEventListener('pointermove', e => { if (stick.hasPointerCapture(e.pointerId)) moveStick(e); });
stick.addEventListener('pointerup', () => { S.stick=[0,0]; knob.style.transform=''; });
function moveStick(e){ const r=stick.getBoundingClientRect(); let x=(e.clientX-r.left-48)/40, y=(e.clientY-r.top-48)/40; const m=Math.hypot(x,y); if (m>1){ x/=m; y/=m; } S.stick=[x,-y]; knob.style.transform=`translate(${x*30}px,${y*30}px)`; }

/* ============================== LOOP ============================== */
const meta=document.getElementById('meta'); let last=performance.now(), acc=0, frames=0;
const ease=(rate,dt)=>1-Math.exp(-rate*dt);
const _fwd=new THREE.Vector3();
function frame(now, forced){
  if (!forced) requestAnimationFrame(frame);
  if (window.__HEADLESS && !forced) return;
  const dt=Math.min(0.1,(now-last)/1000); last=now; S.time+=dt;
  if (!active) return;
  acc+=dt; frames++;
  if (acc>=0.6){ const fps=frames/acc; meta.textContent=Math.round(fps)+' fps'; acc=0; frames=0;
    const ns = 1;
    if (ns!==dynScale){ dynScale=ns; resize(); } }

  const K=S.keys, sp=(K.ShiftLeft||K.ShiftRight?60:16)*dt;
  const f=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0)+S.stick[1], r=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+S.stick[0];
  S.tPos.x += (Math.sin(S.tYaw)*f + Math.cos(S.tYaw)*r)*sp;
  S.tPos.z += (-Math.cos(S.tYaw)*f + Math.sin(S.tYaw)*r)*sp;
  if (K.KeyE||K.Space) S.tPos.y += sp*0.8;
  if (K.KeyQ||K.KeyC) S.tPos.y -= sp*0.8;
  const floor = Math.max(active.heightAt(S.tPos.x, S.tPos.z), 0) + 1.8;
  if (S.tPos.y < floor) S.tPos.y = floor;
  S.pos.lerp(S.tPos, ease(8,dt));
  S.yaw += (S.tYaw-S.yaw)*ease(12,dt); S.pitch += (S.tPitch-S.pitch)*ease(12,dt);
  const a=ease(2.2,dt), s0=S.sun[0], s1=S.sun[1]; S.sun[0]+=(S.tSun[0]-S.sun[0])*a; S.sun[1]+=(S.tSun[1]-S.sun[1])*a;
  if (Math.abs(s0-S.sun[0])+Math.abs(s1-S.sun[1]) > 0.0008) envDirty = true;
  const b=ease(1.6,dt), pw=S.wx[1]; S.wx[0]+=(S.tWx[0]-S.wx[0])*b; S.wx[1]+=(S.tWx[1]-S.wx[1])*b; if (Math.abs(pw-S.wx[1])>0.002) envDirty = true;

  camera.position.copy(S.pos);
  _fwd.set(Math.sin(S.yaw)*Math.cos(S.pitch), Math.sin(S.pitch), -Math.cos(S.yaw)*Math.cos(S.pitch));
  camera.lookAt(_fwd.add(S.pos));
  const env = updateAtmosphere(dt);
  verdantFrame(camera);
  active.update?.(dt, env);
  renderer.render(scene, camera);
}
applyQuality();
loadBiome(startId);
requestAnimationFrame(frame);
</script>
