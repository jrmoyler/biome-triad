name: Render harness regression
on: [push, pull_request]
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/render-harness/tests/*.test.mjs extensions/surface-state/tests/*.test.mjs
